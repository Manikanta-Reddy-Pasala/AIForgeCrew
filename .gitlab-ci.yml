# AIForgeCrew — build stage that emits sonar/ and blackduck/ scan inputs.
# The scans themselves come from the shared templates below (same ones
# omni-server uses); this file only has to produce what they consume.

include:
  # SonarQube scan (same shared template omni-server uses)
  - project: infrastructure/gitlab-ci-templates
    file: [sonarqube/sonarqube-generic-template-ci.yml]
    ref: 2.3.42
    inputs:
      image: docker.artifactory.internal/build-images/sonarqube-scanner:1.1.0
  - project: 'infrastructure/gitlab-ci-templates'
    file: 'blackduck/blackduck-generic-template-ci.yml'

# ---- rules helpers (omni-server pattern) ----
.rules_default:
  rules:
    - if: $CI_PIPELINE_SOURCE =~ /\b(pipeline|schedule)\b/
      when: never

.default_rules:
  rules:
    - !reference [.rules_default, rules]
    - when: on_success

stages:
  - build
  - sast_analysis
  - security_scan
  - sca_analysis

variables:
  PIP_CACHE_DIR: ${CI_PROJECT_DIR}/.cache/pip
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

# ---- build ----
build:
  image: python:3.12
  stage: build
  tags: [restricted-online]
  extends: [.default_rules]
  cache:
    key: "uv-$CI_COMMIT_REF_SLUG"
    paths:
      - .uv-cache/
  before_script:
    # tmux: the Doer's bash tool keeps ONE session per run, which is what makes
    # `cd` / `export` persist between bash() calls. Without the binary those
    # tests can only skip — and the pty-echo bug they now cover went unnoticed
    # for exactly that reason. It is ~1MB; install it so CI really runs them.
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates tmux
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - . "$HOME/.local/bin/env"
  script:
    - mkdir -p sonar blackduck test-results

    # ---------- deps + package ----------
    # A runner that reuses its workspace can carry a HALF-UPDATED venv across
    # jobs — the symptom is an ImportError of a name one module of a package
    # imports from another module of the SAME package (e.g. litellm's utils.py
    # importing DEFAULT_MINIMUM_PROMPT_CACHE_TOKEN_COUNT from its constants.py,
    # both of which ship in the pinned 1.98.0). uv sync repairs what it tracks,
    # not a venv someone else half-wrote, so rebuild it; .uv-cache keeps it fast.
    # --frozen => resolve from uv.lock exactly (Black Duck must see the SHIPPED versions)
    - rm -rf .venv
    - uv sync --all-extras --dev --frozen
    - uv run --with build python -m build --sdist --wheel

    # ---------- tests -> sonar/ ----------
    # pytest-cov is NOT in [dev]; --with injects it without touching pyproject.
    #
    # NO -m HERE ON PURPOSE. pyproject's addopts already deselects every
    # live-only marker, and a -m on the command line REPLACES that list rather
    # than adding to it — which is how this job ran the tmux / GA / graphify
    # tests on a runner that had none of them and reported 20 failures that
    # meant nothing. The old line also named `live_neo4j`, a marker this repo
    # has never registered, while missing live_tmux / live_ga / live_jupyter /
    # live_aider. Markers live in pyproject; this job just runs pytest.
    - >
      uv run --with pytest-cov pytest
      -q
      --junitxml=test-results/junit.xml
      --cov=aiforge_core --cov=scripts
      --cov-report=xml:sonar/coverage.xml
      --cov-report=term
    - cp test-results/junit.xml sonar/junit.xml

    # ---------- frontend (Sonar reads web/src; skip if no web/) ----------
    # python:3.12 has no node — `npm ci` there is "npm: command not found",
    # which failed the whole job AFTER a green test run. Sonar analyses
    # web/src as SOURCE, it never reads web/dist, and Black Duck gets
    # package-lock.json copied below, so the built UI is not an input to
    # either scan: build it when npm happens to be present, skip loudly
    # otherwise. (Want the built UI in the artifacts? Install node in
    # before_script — it is not needed for the scans.)
    - |
      if [ ! -f web/package.json ]; then
        echo "no web/package.json — nothing to build"
      elif command -v npm >/dev/null 2>&1; then
        (cd web && npm ci --no-audit --no-fund && npm run build)
      else
        echo "npm not on PATH — skipping the web build (Sonar reads web/src, not web/dist)"
      fi

    # ---------- sonar/sonar-project.properties ----------
    - |
      cat > sonar/sonar-project.properties <<EOF
      sonar.projectKey=aiforgecrew
      sonar.projectName=AIForgeCrew
      sonar.projectVersion=${CI_COMMIT_SHORT_SHA}
      sonar.sources=aiforge_core,scripts,web/src
      sonar.tests=tests
      sonar.sourceEncoding=UTF-8
      sonar.python.version=3.12
      sonar.python.coverage.reportPaths=sonar/coverage.xml
      sonar.python.xunit.reportPath=sonar/junit.xml
      sonar.exclusions=**/node_modules/**,**/.venv/**,**/.worktrees/**,**/web/dist/**,**/__pycache__/**,**/*.min.js,**/.uv-cache/**
      sonar.scm.provider=git
      EOF

    # ---------- blackduck/ ----------
    # Detect's PIP detector wants a flat pinned requirements.txt; uv export makes one from the lock.
    - uv export --frozen --all-extras --no-hashes --format requirements-txt -o blackduck/requirements.txt
    - uv export --frozen --all-extras --no-dev --no-hashes --format requirements-txt -o blackduck/requirements-prod.txt
    - cp uv.lock pyproject.toml blackduck/
    - |
      if [ -f web/package-lock.json ]; then
        mkdir -p blackduck/web && cp web/package.json web/package-lock.json blackduck/web/
      fi
    # CycloneDX SBOM of the ACTUAL resolved venv (catches transitive pins the lock text hides)
    - uv run --with cyclonedx-bom cyclonedx-py environment .venv -o blackduck/sbom.cyclonedx.json
    - cp dist/*.whl dist/*.tar.gz blackduck/ 2>/dev/null || true
    - ls -R sonar blackduck

  artifacts:
    name: "$CI_PROJECT_NAME-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 1 week
    paths:
      - dist/
      - sonar/
      - blackduck/
      - test-results/
    reports:
      junit: test-results/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: sonar/coverage.xml
  coverage: '/^TOTAL\s+.*\s+(\d+(?:\.\d+)?)%$/'
