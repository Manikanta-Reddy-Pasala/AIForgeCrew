# Offline runner: nothing here leaves the estate. Scans come from the shared
# templates; this file only produces what they consume.

include:
  - project: infrastructure/gitlab-ci-templates
    file: [sonarqube/sonarqube-generic-template-ci.yml]
    ref: 2.3.42
    inputs:
      image: docker.artifactory.internal/build-images/sonarqube-scanner:1.1.0
  - project: 'infrastructure/gitlab-ci-templates'
    file: 'blackduck/blackduck-generic-template-ci.yml'

.rules_default:
  rules:
    - if: $CI_PIPELINE_SOURCE =~ /\b(pipeline|schedule)\b/
      when: never

.default_rules:
  rules:
    - !reference [.rules_default, rules]
    - when: on_success

stages:
  - build
  - sast_analysis
  - sca_analysis
  - package

variables:
  ARTIFACTORY_HOST: "artifactory.internal"
  # Where `cli:publish` puts the binaries. A generic (not pypi/npm) repo: these
  # are plain files, not packages.
  CLI_ARTIFACT_REPO: "generic-local"
  BUILD_IMAGE: "ubuntu:24.04"
  UBUNTU_SUITE: "noble"
  UV_VERSION: "0.12.10"
  # 3.12, not 3.13: uv.lock pins numpy 1.26.4, which ships no cp313 wheel, so
  # 3.13 falls back to the sdist and wants a C compiler that is not installed.
  UV_PYTHON: "3.12"

  APT_REMOTE: "https://$ARTIFACTORY_HOST/artifactory/debian-remote"
  APT_SECURITY_REMOTE: "https://$ARTIFACTORY_HOST/artifactory/security-debian-remote"
  PIP_INDEX_URL: "https://$ARTIFACTORY_HOST:443/artifactory/api/pypi/pypi-remote/simple/"
  npm_config_registry: "https://$ARTIFACTORY_HOST/artifactory/api/npm/npm-remote/"

  # Fail loudly on a miss rather than reaching for python-build-standalone.
  UV_PYTHON_DOWNLOADS: "never"
  UV_PYTHON_PREFERENCE: "only-system"
  UV_SYSTEM_CERTS: "true"
  NODE_EXTRA_CA_CERTS: "/etc/ssl/certs/ca-certificates.crt"

  # Load-bearing: npm ci runs in web/, so a project-root .npmrc is never read.
  npm_config_userconfig: "$CI_PROJECT_DIR/.npmrc"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  npm_config_cache: "$CI_PROJECT_DIR/.npm-cache"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

.artifactory_setup:
  # $ARTIFACTORY_CA is a File-type CI/CD variable holding the chain PEM. apt
  # needs it before the system store has it, hence the explicit CaInfo.
  before_script:
    - cp "$ARTIFACTORY_CA" /tmp/cert.pem
    - rm -f /etc/apt/sources.list /etc/apt/sources.list.d/*
    - |
      for suite in "$UBUNTU_SUITE" "$UBUNTU_SUITE-updates" "$UBUNTU_SUITE-backports"; do
        echo "deb $APT_REMOTE $suite main universe restricted multiverse"
      done > /etc/apt/sources.list.d/artifactory.list
    - echo "deb $APT_SECURITY_REMOTE $UBUNTU_SUITE main universe restricted multiverse" >> /etc/apt/sources.list.d/artifactory.list
    - apt-get update -o Acquire::https::CaInfo=/tmp/cert.pem
    - apt-get install -o Acquire::https::CaInfo=/tmp/cert.pem -y --no-install-recommends curl ca-certificates git tmux python3-full python3-pip
    - mv /tmp/cert.pem /usr/local/share/ca-certificates/chain_ca.crt && update-ca-certificates
    # Unset, printf still writes a file — a malformed one. pip then 401s, tries
    # to PROMPT, and dies in an EOFError traceback naming neither host nor
    # credential. One ~/.netrc serves both pip and uv.
    - |
      : "${ARTIFACTORY_USER:?set as a CI/CD variable}" "${ARTIFACTORY_TOKEN:?set as a masked CI/CD variable}"
    - printf 'machine %s login %s password %s\n' "$ARTIFACTORY_HOST" "$ARTIFACTORY_USER" "$ARTIFACTORY_TOKEN" > ~/.netrc
    - chmod 600 ~/.netrc
    # pip, not pipx: pipx upgrades pip inside its own venv, so it asks the index
    # for `pip` too, which a curated repo often does not carry.
    - pip install --break-system-packages --no-input --quiet "uv==$UV_VERSION"
    - uv --version && uv python find "$UV_PYTHON"

build:
  image: $BUILD_IMAGE
  stage: build
  #tags: [restricted-offline]
  extends: [.default_rules, .artifactory_setup]
  # One build job at a time for this project. Two pipelines' build jobs on the
  # same runner share `/builds/<namespace>/<project>`, and the newer one clears
  # that directory before cloning — which is what an older job that finished its
  # script and then could not cd back in to save its cache/artifacts looks like.
  resource_group: build
  cache:
    key: "uv-$CI_COMMIT_REF_SLUG"
    paths:
      - .uv-cache/
      - .npm-cache/
  script:
    - mkdir -p sonar blackduck test-results
    # A reused workspace can carry a half-written venv; uv sync does not repair one.
    - rm -rf .venv

    - uv sync --all-extras --dev
    - uv run python -m build --sdist --wheel

    # The nodejs wheel's own bin/npm is broken and PATH does not fix it — only
    # node against npm-cli.js works.
    - |
      NW="$(.venv/bin/python -c 'import nodejs_wheel, pathlib; print(pathlib.Path(nodejs_wheel.__file__).parent)')"
      ln -sf "$NW/bin/node" .venv/bin/node
      for t in npm npx; do
        printf '#!/bin/sh\nexec "%s/bin/node" "%s/lib/node_modules/npm/bin/%s-cli.js" "$@"\n' "$NW" "$NW" "$t" > ".venv/bin/$t"
        chmod +x ".venv/bin/$t"
      done
      export PATH="$CI_PROJECT_DIR/.venv/bin:$PATH"
      node --version && npm --version

    # No -m: pyproject's addopts already deselects the live markers, and a -m
    # here REPLACES that list rather than adding to it.
    - >
      uv run pytest
      -q
      --junitxml=test-results/junit.xml
      --cov=aiforge_core --cov=scripts
      --cov-report=xml:sonar/coverage.xml
      --cov-report=term
    - cp test-results/junit.xml sonar/junit.xml
    # Say in the LOG how many tests ran. The junit report is an ARTIFACT, so
    # when the upload step is what fails, the job's own log is the only place
    # left to answer "did the tests actually run?" — and it could not.
    - |
      echo "== tests: $(grep -o '<testcase' test-results/junit.xml | wc -l) case(s), $(grep -o '<failure' test-results/junit.xml | wc -l) failure(s), $(grep -o '<error' test-results/junit.xml | wc -l) error(s)"

    # Host-only scoping is enough; the registry path need not match.
    - |
      if [ ! -f web/package.json ]; then
        echo "no web/package.json — nothing to build"
      else
        printf '//%s/:_authToken=%s\n' "$ARTIFACTORY_HOST" "$ARTIFACTORY_TOKEN" > "$CI_PROJECT_DIR/.npmrc"
        (cd web && npm ci --no-audit --no-fund && npm run build)
      fi

    - cp sonar-project.properties sonar/sonar-project.properties

    - uv export --frozen --all-extras --no-hashes --format requirements-txt -o blackduck/requirements.txt
    - uv export --frozen --all-extras --no-dev --no-hashes --format requirements-txt -o blackduck/requirements-prod.txt
    - cp uv.lock pyproject.toml blackduck/
    - |
      if [ -f web/package-lock.json ]; then
        mkdir -p blackduck/web && cp web/package.json web/package-lock.json blackduck/web/
      fi
    - uv run cyclonedx-py environment .venv -o blackduck/sbom.cyclonedx.json
    - cp dist/*.whl dist/*.tar.gz blackduck/ 2>/dev/null || true

    # The job has failed with `cd: $CI_PROJECT_DIR: No such file or directory`
    # at "Saving cache" and "Uploading artifacts" — phases that run AFTER this
    # script and each begin by cd-ing here. So the build directory went away
    # between the last command below and those steps, which is the runner's
    # half of the job, not ours (an after_script cannot report it: the runner
    # cds into the same missing directory to run that too). This line is the
    # last thing the script sees; if it prints a healthy directory and the next
    # phase still cannot cd into it, the loss is outside the script — look at
    # concurrent jobs sharing this build dir, and at the runner's disk.
    - |
      echo "== build dir at script end: $(ls -d "$CI_PROJECT_DIR") ($(ls -A "$CI_PROJECT_DIR" | wc -l) entries)"
      df -h "$CI_PROJECT_DIR" | tail -1

  artifacts:
    name: "$CI_PROJECT_NAME-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 1 week
    paths:
      - dist/
      - sonar/
      - blackduck/
      - test-results/
      - uv.lock   # commit it when it differs — see the relock step above
    reports:
      junit: test-results/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: sonar/coverage.xml
  coverage: '/^TOTAL\s+.*\s+(\d+(?:\.\d+)?)%$/'

# ── the aiforge CLI binaries ────────────────────────────────────────────────
# PyInstaller freezes the interpreter it RUNS on: it cannot cross-compile. So a
# Linux runner can build the Linux variants and nothing else — the Windows .exe
# and the macOS universal2 binary have to be built on those systems (see
# installer/cli/README.md). Pretending otherwise in a job here would just move
# the failure into the pipeline.

.cli_binary:
  stage: package
  extends: [.default_rules, .artifactory_setup]
  variables:
    # The script installs the pinned PyInstaller and this package from the
    # index; .artifactory_setup has already written ~/.netrc and the CA.
    UV_DEFAULT_INDEX: "$PIP_INDEX_URL"
  script:
    - installer/cli/build-binary.sh --out "dist/cli/$CLI_TARGET"
    - "\"dist/cli/$CLI_TARGET/aiforge\" --version"
    - ls -lh "dist/cli/$CLI_TARGET"
  artifacts:
    name: "aiforge-cli-$CLI_TARGET-$CI_COMMIT_SHORT_SHA"
    expire_in: 1 month
    paths:
      - dist/cli/

cli:linux-amd64:
  extends: .cli_binary
  image: $BUILD_IMAGE
  variables:
    CLI_TARGET: "linux-amd64"

cli:linux-arm64:
  extends: .cli_binary
  # Needs an arm64 runner, or binfmt/qemu registered on an x86_64 one. Manual
  # and allow_failure on purpose: a runner without binfmt should report that,
  # not redden the pipeline.
  image:
    name: $BUILD_IMAGE
    docker:
      platform: linux/arm64
  variables:
    CLI_TARGET: "linux-arm64"
  when: manual
  allow_failure: true

cli:publish:
  stage: package
  image: $BUILD_IMAGE
  extends: .default_rules
  # MANUAL, and with -k: the upload skips certificate verification against the
  # internal host, which is a decision a human takes per release rather than
  # something a pipeline does on every push.
  when: manual
  needs:
    - job: cli:linux-amd64
      artifacts: true
    - job: cli:linux-arm64
      artifacts: true
      optional: true
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates
  script:
    - |
      : "${ARTIFACTORY_USER:?set as a CI/CD variable}" "${ARTIFACTORY_TOKEN:?set as a masked CI/CD variable}"
      # The binary carries the whole app, not just the CLI: the CLI's version
      # alone would overwrite one path with a different app on every release.
      VER="$(sed -n 's/^version = "\(.*\)"/\1/p' packages/aiforge_cli/pyproject.toml)-$CI_COMMIT_SHORT_SHA"
      BASE="https://$ARTIFACTORY_HOST/artifactory/$CLI_ARTIFACT_REPO/aiforge-cli/$VER"
      echo "== publishing aiforge-cli $VER to $BASE"
      found=0
      for dir in dist/cli/*/; do
        target="$(basename "$dir")"
        for f in "$dir"aiforge "$dir"aiforge.exe "$dir"aiforge-completion.*; do
          [ -f "$f" ] || continue
          found=1
          echo "-> $target/$(basename "$f")"
          curl -k -sS --fail-with-body -u "$ARTIFACTORY_USER:$ARTIFACTORY_TOKEN" \
               -T "$f" "$BASE/$target/$(basename "$f")"
          echo
        done
      done
      [ "$found" = 1 ] || { echo "nothing in dist/cli/ to publish"; exit 1; }
      # The same line, for the macOS and Windows binaries a Linux runner cannot
      # build. Run it on that machine after installer/cli/build-binary.sh.
      echo
      echo "for a mac or windows build, from that machine:"
      echo "  curl -k -u \"\$ARTIFACTORY_USER:\$ARTIFACTORY_TOKEN\" -T dist/cli/aiforge \\"
      echo "       \"$BASE/<macos-universal2|windows-amd64>/aiforge\""
