# Offline runner: nothing here leaves the estate. Scans come from the shared
# templates; this file only produces what they consume.

include:
  - project: infrastructure/gitlab-ci-templates
    file: [sonarqube/sonarqube-generic-template-ci.yml]
    ref: 2.3.42
    inputs:
      image: docker.artifactory.internal/build-images/sonarqube-scanner:1.1.0
  - project: 'infrastructure/gitlab-ci-templates'
    file: 'blackduck/blackduck-generic-template-ci.yml'

.rules_default:
  rules:
    - if: $CI_PIPELINE_SOURCE =~ /\b(pipeline|schedule)\b/
      when: never

.default_rules:
  rules:
    - !reference [.rules_default, rules]
    - when: on_success

stages:
  - build
  - sast_analysis
  - sca_analysis

variables:
  # Defaults only — a project CI/CD variable of the same name overrides them.
  # `include:` above cannot read these: it is resolved before job variables
  # exist, so the scanner image there stays spelled out.
  ARTIFACTORY_HOST: "artifactory.internal"
  ARTIFACTORY_DOCKER_HOST: "docker.artifactory.internal"
  BUILD_IMAGE: "$ARTIFACTORY_DOCKER_HOST/docker-remote/ubuntu:24.04"
  UBUNTU_SUITE: "noble"
  UV_VERSION: "0.12.10"
  # 3.12, not 3.13: uv.lock pins numpy 1.26.4, which publishes no cp313 wheel,
  # so on 3.13 uv falls back to the sdist and wants a C compiler that is not
  # installed. 3.13 also fails three of the TLS chain tests.
  UV_PYTHON: "3.12"

  # Artifactory proxies, one per package manager.
  APT_REMOTE: "https://$ARTIFACTORY_HOST/artifactory/debian-remote"
  APT_SECURITY_REMOTE: "https://$ARTIFACTORY_HOST/artifactory/security-debian-remote"
  PIP_INDEX_URL: "https://$ARTIFACTORY_HOST:443/artifactory/api/pypi/pypi-remote/simple/"
  npm_config_registry: "https://$ARTIFACTORY_HOST/artifactory/api/npm/npm-remote/"
  # The pypi index also lives in pyproject.toml, as the DEFAULT
  # [[tool.uv.index]] — that is what makes `uv lock` write this host into
  # uv.lock. It does not affect `uv sync --frozen`, which only ever fetches the
  # URLs already in the lock.

  # The interpreter is apt's: noble ships 3.12.3, which is what the lock wants,
  # so uv never fetches one. Both switches together mean a miss fails loudly
  # instead of quietly reaching for python-build-standalone on github.com.
  # If Artifactory does proxy that (a github-remote repository), the other route
  # is UV_PYTHON_INSTALL_MIRROR pointed at
  # <host>/artifactory/github-remote/astral-sh/python-build-standalone/releases/download
  # plus `uv python install --system-certs "$UV_PYTHON"` in before_script.
  UV_PYTHON_DOWNLOADS: "never"
  UV_PYTHON_PREFERENCE: "only-system"

  # TLS verification is ON: the CA is installed in before_script. uv reads
  # bundled Mozilla roots unless told otherwise, and node ships its own list;
  # git, curl and pip read the system store once update-ca-certificates has run.
  UV_SYSTEM_CERTS: "true"
  NODE_EXTRA_CA_CERTS: "/etc/ssl/certs/ca-certificates.crt"

  # Neither pip nor npm has a username/password env pair; both read a file.
  # userconfig is load-bearing: npm ci runs in web/ and would never find a
  # .npmrc at the project root. pip and uv both read ~/.netrc, written below.
  npm_config_userconfig: "$CI_PROJECT_DIR/.npmrc"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  npm_config_cache: "$CI_PROJECT_DIR/.npm-cache"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

.artifactory_setup:
  # $ARTIFACTORY_CA is a File-type CI/CD variable holding the chain PEM.
  # apt needs it before it can install anything, hence the explicit CaInfo on
  # the first two calls — after update-ca-certificates the system store carries
  # it and nothing else needs to be told.
  before_script:
    - cp "$ARTIFACTORY_CA" /tmp/cert.pem
    - rm -f /etc/apt/sources.list /etc/apt/sources.list.d/*
    - |
      for suite in "$UBUNTU_SUITE" "$UBUNTU_SUITE-updates" "$UBUNTU_SUITE-backports"; do
        echo "deb $APT_REMOTE $suite main universe restricted multiverse"
      done > /etc/apt/sources.list.d/artifactory.list
    - echo "deb $APT_SECURITY_REMOTE $UBUNTU_SUITE main universe restricted multiverse" >> /etc/apt/sources.list.d/artifactory.list
    - apt-get update -o Acquire::https::CaInfo=/tmp/cert.pem
    # git because the job runs in a repository; tmux (~1MB) because the
    # persistent-shell tests skip without it; python3 because it is the
    # interpreter the venv is built on.
    - apt-get install -o Acquire::https::CaInfo=/tmp/cert.pem -y --no-install-recommends curl ca-certificates git tmux python3-full python3-pip
    - mv /tmp/cert.pem /usr/local/share/ca-certificates/chain_ca.crt && update-ca-certificates
    # Unset or empty, printf still writes a file — a malformed one. pip then
    # gets 401, tries to PROMPT for a username, and dies in ask_input with
    # `EOFError: EOF when reading a line` under a 40-line traceback that names
    # neither the credential nor the host. Fail here instead.
    - |
      : "${ARTIFACTORY_USER:?set ARTIFACTORY_USER as a CI/CD variable}"
      : "${ARTIFACTORY_TOKEN:?set ARTIFACTORY_TOKEN as a masked CI/CD variable}"
    - printf 'machine %s login %s password %s\n' "$ARTIFACTORY_HOST" "$ARTIFACTORY_USER" "$ARTIFACTORY_TOKEN" > ~/.netrc
    - chmod 600 ~/.netrc
    # One request that says which of the three it is, before anything long runs.
    - |
      code=$(curl -sS -o /dev/null -w '%{http_code}' --netrc "$PIP_INDEX_URL" 2>/dev/null || true)
      : "${code:=000}"
      echo "pypi index -> HTTP $code"
      case "$code" in
        401) echo "401: ~/.netrc did not authenticate. machine must be the bare host ($ARTIFACTORY_HOST), and HOME here is $HOME."; exit 1 ;;
        403) echo "403: authenticated, but this token may not read pypi-remote."; exit 1 ;;
        404) echo "404: wrong path — check PIP_INDEX_URL."; exit 1 ;;
        000) echo "no response: DNS, TLS or firewall, not credentials."; exit 1 ;;
      esac
    # pip, not pipx. pipx first upgrades pip inside its own shared venv, so it
    # asks the index for `pip` as well as for `uv` — and a curated internal repo
    # often does not carry pip. That extra request is the one that fails with
    # "Could not find a version that satisfies the requirement pip>=23.1".
    # --break-system-packages because 24.04 marks the system python PEP 668.
    # --no-input: without it a 401 ends in an EOFError traceback from a prompt
    # that can never be answered, instead of an error naming the response.
    - pip install --break-system-packages --no-input --quiet "uv==$UV_VERSION"
    - uv --version && python3 --version && uv python find "$UV_PYTHON"

build:
  image: $BUILD_IMAGE
  stage: build
  #tags: [restricted-offline]
  extends: [.default_rules, .artifactory_setup]
  cache:
    key: "uv-$CI_COMMIT_REF_SLUG"
    paths:
      - .uv-cache/
      - .npm-cache/
  script:
    - mkdir -p sonar blackduck test-results
    # `uv sync --frozen` fetches the URLs recorded in uv.lock and never asks the
    # configured index. A lock resolved against PyPI therefore sends this runner
    # to files.pythonhosted.org, where it spends 46s per package before failing.
    # Say so in one line instead.
    - |
      if grep -q 'registry = "https://pypi.org/simple"' uv.lock; then
        echo "uv.lock records PyPI as its registry, so --frozen will fetch files.pythonhosted.org."
        echo "Run the manual 'relock' job and commit the uv.lock it produces."
        exit 1
      fi

    # A reused workspace can carry a half-written venv across jobs; uv sync does not repair one.
    - rm -rf .venv
    - uv sync --all-extras --dev --frozen
    - uv run python -m build --sdist --wheel

    # The nodejs wheel's own bin/npm is broken and PATH does not fix it —
    # only node against npm-cli.js works.
    - |
      NW="$(.venv/bin/python -c 'import nodejs_wheel, pathlib; print(pathlib.Path(nodejs_wheel.__file__).parent)')"
      ln -sf "$NW/bin/node" .venv/bin/node
      for t in npm npx; do
        printf '#!/bin/sh\nexec "%s/bin/node" "%s/lib/node_modules/npm/bin/%s-cli.js" "$@"\n' "$NW" "$NW" "$t" > ".venv/bin/$t"
        chmod +x ".venv/bin/$t"
      done
      export PATH="$CI_PROJECT_DIR/.venv/bin:$PATH"
      node --version && npm --version

    # No -m: pyproject's addopts already deselects the live markers, and a -m
    # here REPLACES that list rather than adding to it.
    - >
      uv run pytest
      -q
      --junitxml=test-results/junit.xml
      --cov=aiforge_core --cov=scripts
      --cov-report=xml:sonar/coverage.xml
      --cov-report=term
    - cp test-results/junit.xml sonar/junit.xml

    # Host-only scoping is enough, the registry path does not have to match.
    # Basic instead of bearer: //$ARTIFACTORY_HOST/:_auth=$(printf '%s:%s' "$ARTIFACTORY_USER" "$ARTIFACTORY_TOKEN" | base64 -w0)
    - |
      if [ ! -f web/package.json ]; then
        echo "no web/package.json — nothing to build"
      else
        printf '//%s/:_authToken=%s\n' "$ARTIFACTORY_HOST" "$ARTIFACTORY_TOKEN" > "$CI_PROJECT_DIR/.npmrc"
        (cd web && npm ci --no-audit --no-fund && npm run build)
      fi

    - cp sonar-project.properties sonar/sonar-project.properties

    - uv export --frozen --all-extras --no-hashes --format requirements-txt -o blackduck/requirements.txt
    - uv export --frozen --all-extras --no-dev --no-hashes --format requirements-txt -o blackduck/requirements-prod.txt
    - cp uv.lock pyproject.toml blackduck/
    - |
      if [ -f web/package-lock.json ]; then
        mkdir -p blackduck/web && cp web/package.json web/package-lock.json blackduck/web/
      fi
    - uv run cyclonedx-py environment .venv -o blackduck/sbom.cyclonedx.json
    - cp dist/*.whl dist/*.tar.gz blackduck/ 2>/dev/null || true
    - ls -R sonar blackduck

  artifacts:
    name: "$CI_PROJECT_NAME-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 1 week
    paths:
      - dist/
      - sonar/
      - blackduck/
      - test-results/
    reports:
      junit: test-results/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: sonar/coverage.xml
  coverage: '/^TOTAL\s+.*\s+(\d+(?:\.\d+)?)%$/'

# uv.lock has to be resolved from Artifactory, and this runner is the only place
# that can reach it. Manual: run it when dependencies change, download the
# uv.lock artifact, commit it.
relock:
  image: $BUILD_IMAGE
  stage: build
  # NOT `extends: .default_rules` + a job-level `when: manual`: a job's own
  # `rules:` override the top-level `when`, so `.default_rules` ending in
  # `when: on_success` made this run on EVERY pipeline, in parallel with build.
  # allow_failure so an un-clicked manual job never blocks the pipeline.
  extends: [.artifactory_setup]
  rules:
    - !reference [.rules_default, rules]
    - when: manual
      allow_failure: true
  script:
    - uv lock --no-cache
    - |
      internal=$(grep -c 'artifactory' uv.lock || true)
      pypi=$(grep -c 'pypi.org' uv.lock || true)
      echo "internal $internal / pypi $pypi"
      if [ "$internal" -eq 0 ]; then
        echo "no Artifactory URL in the lock at all — [[tool.uv.index]] default=true is not being read."
        exit 1
      fi
      if grep -q 'registry = "https://pypi.org/simple"' uv.lock; then
        echo "still PyPI — is the index default in pyproject.toml?"
        exit 1
      fi
      echo "commit this uv.lock artifact."
  artifacts:
    paths: [uv.lock]
    expire_in: 1 week
