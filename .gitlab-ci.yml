# Offline runner: nothing here leaves the estate. Scans come from the shared
# templates; this file only produces what they consume.

include:
  - project: infrastructure/gitlab-ci-templates
    file: [sonarqube/sonarqube-generic-template-ci.yml]
    ref: 2.3.42
    inputs:
      image: docker.artifactory.internal/build-images/sonarqube-scanner:1.1.0
  - project: 'infrastructure/gitlab-ci-templates'
    file: 'blackduck/blackduck-generic-template-ci.yml'

.rules_default:
  rules:
    - if: $CI_PIPELINE_SOURCE =~ /\b(pipeline|schedule)\b/
      when: never

.default_rules:
  rules:
    - !reference [.rules_default, rules]
    - when: on_success

stages:
  - build
  - sast_analysis
  - sca_analysis

variables:
  # `af=` is load-bearing: with a bare URL uv sends NO auth header at all.
  UV_DEFAULT_INDEX: "af=https://artifactory.internal/artifactory/api/pypi/pypi-remote/simple"
  UV_INDEX_AF_USERNAME: "$ARTIFACTORY_USER"
  UV_INDEX_AF_PASSWORD: "$ARTIFACTORY_TOKEN"
  npm_config_registry: "https://artifactory.internal/artifactory/api/npm/npm-remote/"
  # Both needed only for a corporate CA, and neither is redundant: uv ignores
  # the system store (bundled webpki-roots) and node ships its own CA list.
  # git/curl/python already read /etc/ssl/certs by default.
  UV_NATIVE_TLS: "true"
  NODE_EXTRA_CA_CERTS: "/etc/ssl/certs/ca-certificates.crt"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  npm_config_cache: "$CI_PROJECT_DIR/.npm-cache"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

build:
  # Pinned: the floating python3.12-bookworm-slim tag is uv 0.9.30, uv:latest is 0.12.10.
  image: docker.artifactory.internal/ghcr-remote/astral-sh/uv:0.9.30-python3.12-bookworm-slim
  stage: build
  #tags: [restricted-offline]
  extends: [.default_rules]
  cache:
    key: "uv-$CI_COMMIT_REF_SLUG"
    paths:
      - .uv-cache/
      - .npm-cache/
  # Corporate CA: drop $ARTIFACTORY_CA in as a File-type CI variable. Skip the
  # whole block if Artifactory's cert is publicly trusted.
  #before_script:
  #  - cp "$ARTIFACTORY_CA" /usr/local/share/ca-certificates/corp.crt && update-ca-certificates
  script:
    - uv --version
    - mkdir -p sonar blackduck test-results

    # A reused workspace can carry a half-written venv across jobs; uv sync does not repair one.
    - rm -rf .venv
    - uv sync --all-extras --dev --frozen
    - uv run python -m build --sdist --wheel

    # The nodejs wheel's own bin/npm is broken and PATH does not fix it —
    # only node against npm-cli.js works.
    - |
      NW="$(.venv/bin/python -c 'import nodejs_wheel, pathlib; print(pathlib.Path(nodejs_wheel.__file__).parent)')"
      ln -sf "$NW/bin/node" .venv/bin/node
      for t in npm npx; do
        printf '#!/bin/sh\nexec "%s/bin/node" "%s/lib/node_modules/npm/bin/%s-cli.js" "$@"\n' "$NW" "$NW" "$t" > ".venv/bin/$t"
        chmod +x ".venv/bin/$t"
      done
      export PATH="$CI_PROJECT_DIR/.venv/bin:$PATH"
      node --version && npm --version

    # No -m: pyproject's addopts already deselects the live markers, and a -m
    # here REPLACES that list rather than adding to it.
    - >
      uv run pytest
      -q
      --junitxml=test-results/junit.xml
      --cov=aiforge_core --cov=scripts
      --cov-report=xml:sonar/coverage.xml
      --cov-report=term
    - cp test-results/junit.xml sonar/junit.xml

    - |
      if [ ! -f web/package.json ]; then
        echo "no web/package.json — nothing to build"
      else
        (cd web && npm ci --no-audit --no-fund && npm run build)
      fi

    - cp sonar-project.properties sonar/sonar-project.properties

    - uv export --frozen --all-extras --no-hashes --format requirements-txt -o blackduck/requirements.txt
    - uv export --frozen --all-extras --no-dev --no-hashes --format requirements-txt -o blackduck/requirements-prod.txt
    - cp uv.lock pyproject.toml blackduck/
    - |
      if [ -f web/package-lock.json ]; then
        mkdir -p blackduck/web && cp web/package.json web/package-lock.json blackduck/web/
      fi
    - uv run cyclonedx-py environment .venv -o blackduck/sbom.cyclonedx.json
    - cp dist/*.whl dist/*.tar.gz blackduck/ 2>/dev/null || true
    - ls -R sonar blackduck

  artifacts:
    name: "$CI_PROJECT_NAME-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 1 week
    paths:
      - dist/
      - sonar/
      - blackduck/
      - test-results/
    reports:
      junit: test-results/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: sonar/coverage.xml
  coverage: '/^TOTAL\s+.*\s+(\d+(?:\.\d+)?)%$/'
