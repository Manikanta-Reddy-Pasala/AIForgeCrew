version: 1
# SHA-256 of every model weight file used by any agent.
# Source of truth for download + verification + role assignment.
#
# Runtime: LM Studio MLX on Apple Silicon (Mac Studio M3 Ultra, 96 GB).
# Inference endpoint: http://localhost:1234 (OpenAI-compatible).
# Paths default to LM Studio layout: ~/.lmstudio/models/<publisher>/<repo>/
#
# sha256 computation:
#   - For MLX directory models: shasum -a 256 of every *.safetensors,
#     sorted by filename, concatenated hashes, then re-hashed.
#   - For single-file models (GGUF): direct shasum -a 256 of the file.
# Mode "directory" or "file" encoded via `kind:`.
#
# sha256="tbd" means compute-and-store on first successful download
# (see scripts/compute-checksums.sh). verify-checksums.sh skips "tbd"
# entries on first pass; on re-run they must match.
#
# Current picks (vendor diversity; all <3 months old):
#   Tester       → Mistral  (Devstral-Small-2-24B,  2025-12-09 base)
#   Sr Developer → Qwen     (Qwen3.6-35B-A3B,  existing)
#   Sr Architect → Gemma    (gemma-4-26b-a4b-it, 2026-04-02)
# GLM-4.7-Flash, gemma-4-31b, gemma-4-e2b, qwen3-0.6b removed 2026-04-19.
models:
  - name: "qwen3.6-35b-a3b-mlx-4bit"
    path: "~/.lmstudio/models/mlx-community/Qwen3.6-35B-A3B-4bit/"
    kind: directory
    source_url: "https://huggingface.co/mlx-community/Qwen3.6-35B-A3B-4bit"
    sha256: "97de9d29799ee61a584d0cdb672dccb8cd7ffe2fc2ca4cf9ce6c95a97cfd422c"
    size_gb: 20.43
    format: mlx
    quant: "4bit"
    active_params: "3B"
    total_params: "35B"
    assigned_to: ["sr-developer"]
    role_rationale: "Top SWE-bench Verified (73.4%) in open 30-40B MoE class. 3B active = fastest tok/s under concurrent load."

  - name: "qwen3.5-9b-mlx-4bit"
    path: "~/.lmstudio/models/mlx-community/Qwen3.5-9B-MLX-4bit/"
    kind: directory
