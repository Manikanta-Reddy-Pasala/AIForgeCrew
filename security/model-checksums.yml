version: 1
# SHA-256 of every model weight file used by any agent.
# Source of truth for download + verification + role assignment.
#
# Runtime: LM Studio MLX on Apple Silicon (Mac Studio M3 Ultra, 96 GB).
# Inference endpoint: http://localhost:1234 (OpenAI-compatible).
# Paths default to LM Studio layout: ~/.lmstudio/models/<publisher>/<repo>/
#
# sha256 computation:
#   - For MLX directory models: shasum -a 256 of every *.safetensors,
#     sorted by filename, concatenated hashes, then re-hashed.
#   - For single-file models (GGUF): direct shasum -a 256 of the file.
# Mode "directory" or "file" encoded via `kind:`.
#
# verify-checksums.sh enforces these; mismatches block startup.
# download-models.sh reads source_url to fetch any missing entries.
models:
  - name: "qwen3.6-35b-a3b-mlx-4bit"
