<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>AIForge · Agent Ops</title>
    <script>
      // Apply the persisted theme before first paint to avoid a flash.
      // Falls back to the OS preference when nothing is stored.
      (function () {
        try {
          var stored = localStorage.getItem('aiforge.theme');
          var dark = stored
            ? stored === 'dark'
            : globalThis.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (err) {
          // localStorage throws outright in a private window or with site data
          // blocked. Light is the safe fallback, but swallowing the reason has
          // cost debugging time before — say what happened.
          console.debug('aiforge: theme preload failed', err);
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
