# AIForge — ISOLATED NETWORK mode: `./run.sh --isolated`.
#
# The default `docker-compose.yml` runs the box with `network_mode: host`: it
# shares this machine's network stack, so the egress allowlist in
# `aiforge_core/net/egress.py` is the ONLY thing between the agent and the
# internet — and that list only governs DECLARED destinations (Jira, GitLab,
# SMTP, MCP, telemetry) and page fetches. A `curl` typed into the agent's shell
# never passes through it.
#
# This file is the network-level answer, and it is a REPLACEMENT base rather
# than an overlay: compose cannot take `network_mode: host` back off once the
# default file has set it (declaring `networks:` alongside it is an error), so
# `--isolated` selects this file INSTEAD of docker-compose.yml.
#
# The shape:
#   box    an `internal` network — no route to the internet at all.
#   out    an ordinary bridge, reachable from the host and the world.
#   egress the ONLY thing on both. A proxy holding the allowlist; the box's
#          http_proxy/https_proxy point at it, so every outbound request either
#          matches a listed host or is refused by something the agent cannot
#          talk its way past.
#   ui     also on both, publishing the UI to the host's loopback — the box
#          itself cannot publish a port, because a container on an internal
#          network is not reachable from outside it.
#
#   egress-ctl  owns the allowlist, OUTSIDE the box, on a network of its own.
#          You edit it in Settings; the UI front door forwards /egress-admin/
#          to it and refuses the box's network and the proxy, so the agent
#          cannot change it. Each entry allows that host and its subdomains,
#          anchored — `pypi.org` never matches `evilpypi.org`. An admin token
#          (AIFORGE_EGRESS_ADMIN_TOKEN) is optional and off by default.
#   model  relays to the model endpoint ONLY (one host:port, no proxy): the
#          model client talks to it directly. run.sh points the box's model URL
#          at it and the relay at your real endpoint (AIFORGE_MODEL_UPSTREAM);
#          an endpoint on this machine's loopback must also listen where docker
#          can reach it (0.0.0.0 or the docker bridge), or use its LAN address.
#
# Do NOT add host.docker.internal to the allowlist: that opens EVERY port on
# this machine to the box (its own UI and API included), not just the model.
services:
  aiforge:
    build:
      context: .
      network: host
      args:
        BASE_REGISTRY: ${AIFORGE_BASE_REGISTRY:-}
        APT_MIRROR: ${AIFORGE_APT_MIRROR:-}
        APP_UID: ${AIFORGE_UID:-1000}
        APP_GID: ${AIFORGE_GID:-1000}
        APP_USER: ${AIFORGE_USER:-aiforge}
        APP_HOME: ${AIFORGE_HOME:-/home/aiforge}
    image: aiforge-sandbox:local
    container_name: aiforge
    restart: unless-stopped
    networks: [box]
    # No raw sockets: no forged packets on the box network. No IPv6: the
    # internal bridge's link-local addresses would reach this machine.
    cap_drop: [NET_RAW]
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 1
      net.ipv6.conf.default.disable_ipv6: 1
    environment:
      # The box listens on its internal network so `ui` can reach it; nothing
      # else can (the network is internal and only `ui` publishes a port, on
      # ${AIFORGE_HOST}, loopback by default). On 127.0.0.1 the UI was dead.
      - AIFORGE_RUN_ARGS=--host 0.0.0.0 ${AIFORGE_RUN_ARGS:-}
      - AIFORGE_ALLOW_UNAUTH_NONLOOPBACK=${AIFORGE_ALLOW_UNAUTH_NONLOOPBACK:-1}
      - AIFORGE_MOUNTS
      - AIFORGE_APT_MIRROR
      # The model through the relay (run.sh sets AIFORGE_BOX_LM_URL).
      - AIFORGE_LM_BASE_URL=${AIFORGE_BOX_LM_URL:-http://model:1234/v1}
      - AIFORGE_DEFAULT_BASE_URL=${AIFORGE_BOX_LM_URL:-http://model:1234/v1}
      - AIFORGE_OPENAI_COMPAT_BASE_URL=${AIFORGE_BOX_LM_URL:-http://model:1234/v1}
      - AIFORGE_ISOLATED=1
      # Settings shows the list (read-only) and links to its editor.
      - AIFORGE_EGRESS_POLICY_RO=/var/lib/aiforge-egress
      - AIFORGE_API_TOKEN
      - AIFORGE_ROLE
      - AIFORGE_ADMIN_URL
      - AIFORGE_SYNC_GROUP
      - AIFORGE_EXTRAS
      - AIFORGE_EMBED_BACKEND
      - AIFORGE_RUNNER_POLL_SEC
      - AIFORGE_NPM_REGISTRY
      - UV_DEFAULT_INDEX
      - npm_config_registry
      # EVERY outbound connection goes through the gatekeeper. Set here, not
      # passed through from the host: in this mode they are not the operator's
      # preference, they are the boundary.
      - http_proxy=http://egress:8888
      - https_proxy=http://egress:8888
      - HTTP_PROXY=http://egress:8888
      - HTTPS_PROXY=http://egress:8888
      - no_proxy=localhost,127.0.0.1,aiforge,egress,ui,model,ssh-egress
      - NO_PROXY=localhost,127.0.0.1,aiforge,egress,ui,model,ssh-egress
      # ssh / scp / rsync / git@… leave through the SSH exit (entrypoint sets
      # the ProxyCommand when AIFORGE_ISOLATED=1).
      - AIFORGE_SSH_PROXY=ssh-egress:8889
    volumes:
      - ${AIFORGE_CONFIG_DIR:-~/.aiforge}:${AIFORGE_HOME:-/home/aiforge}/.aiforge
      - aiforge-state:/var/lib/aiforge
      - egress-policy:/var/lib/aiforge-egress:ro

  # The allowlist, enforced where the agent cannot argue with it: tinyproxy
  # (current Alpine) with its config and reload loop baked into a local image,
  # unprivileged. Policy: /policy/allow.txt, written only by egress-ctl.
  egress:
    build: {context: ./docker/isolated, dockerfile: egress.Dockerfile}
    image: aiforge-isolated-egress:local
    container_name: aiforge-egress
    restart: unless-stopped
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    pids_limit: 256
    networks:
      box: {}
      out:
        # Fixed, so the UI front door can refuse requests that loop back
        # through the proxy (ui-proxy.conf.template).
        ipv4_address: ${AIFORGE_EGRESS_IP:-10.251.251.250}
    volumes:
      - egress-policy:/policy:ro

  # Owns the allowlist (docker/isolated/egress-controller.py), on its OWN
  # network: only the UI front door shares it; the box has no route to it.
  egress-ctl:
    build: {context: ./docker/isolated, dockerfile: egress-ctl.Dockerfile}
    image: aiforge-isolated-egress-ctl:local
    container_name: aiforge-egress-ctl
    restart: unless-stopped
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    pids_limit: 256
    networks: [admin]
    environment:
      # Optional: when set, every call needs it. Off for now.
      - AIFORGE_EGRESS_ADMIN_TOKEN=${AIFORGE_EGRESS_ADMIN_TOKEN:-}
      # The names the UI is opened by: anything else is refused (a website
      # rebinding its own name to this machine cannot edit the list).
      - AIFORGE_UI_HOSTS=${AIFORGE_UI_HOSTS:-localhost,127.0.0.1}
      # Never allowed: the docker networks of this setup.
      - AIFORGE_BOX_SUBNET=${AIFORGE_BOX_SUBNET:-10.251.250.0/24}
      - AIFORGE_OUT_SUBNET=${AIFORGE_OUT_SUBNET:-10.251.251.0/24}
      # First start only: seeds the list. After that Settings owns it.
      - AIFORGE_EGRESS_ALLOW_HOSTS
    volumes:
      - egress-policy:/policy

  # The box's SSH exit: CONNECT to SSH ports only (AIFORGE_SSH_PORTS, 22), and
  # only to hosts on the network allowlist — the same one list as the web
  # (AIFORGE_SSH_EGRESS=allowlist; `any` / `off` exist but are not the default).
  ssh-egress:
    build: {context: ./docker/isolated, dockerfile: ssh-egress.Dockerfile}
    image: aiforge-isolated-ssh-egress:local
    container_name: aiforge-ssh-egress
    restart: unless-stopped
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    pids_limit: 256
    networks: [box, out]
    environment:
      - AIFORGE_SSH_EGRESS=${AIFORGE_SSH_EGRESS:-allowlist}
      - AIFORGE_SSH_PORTS=${AIFORGE_SSH_PORTS:-22}
    volumes:
      - egress-policy:/policy:ro

  # The model endpoint, and nothing else, for the box: one fixed upstream.
  model:
    build: {context: ./docker/isolated, dockerfile: model-relay.Dockerfile}
    image: aiforge-isolated-model-relay:local
    container_name: aiforge-model
    restart: unless-stopped
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    pids_limit: 256
    networks: [box, out]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - AIFORGE_MODEL_LISTEN=${AIFORGE_MODEL_LISTEN:-1234}
      - AIFORGE_MODEL_UPSTREAM=${AIFORGE_MODEL_UPSTREAM:-host.docker.internal:1234}
      - AIFORGE_MODEL_TLS=${AIFORGE_MODEL_TLS:-0}

  # A container on an internal network cannot publish a port, so the UI is
  # served through here instead of from the box directly (nginx, unprivileged).
  ui:
    build: {context: ./docker/isolated, dockerfile: ui.Dockerfile}
    image: aiforge-isolated-ui:local
    container_name: aiforge-ui
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    # Writable only where nginx (uid 101) needs it: its generated config and temp files.
    tmpfs: ["/tmp:uid=101,gid=101,mode=0755", "/etc/nginx/conf.d:uid=101,gid=101,mode=0755"]
    pids_limit: 256
    networks: [box, out, admin]
    ports:
      - "${AIFORGE_HOST:-127.0.0.1}:${AIFORGE_PORT:-8799}:8799"
    environment:
      - AIFORGE_BOX_SUBNET=${AIFORGE_BOX_SUBNET:-10.251.250.0/24}
      - AIFORGE_EGRESS_IP=${AIFORGE_EGRESS_IP:-10.251.251.250}

networks:
  box:
    internal: true
    enable_ipv6: false
    driver_opts:
      # No address for THIS machine on the box's bridge: without it the box
      # reached every service listening on the host (ssh, the AIForge API…)
      # through the bridge's gateway, internal network or not.
      com.docker.network.bridge.inhibit_ipv4: "true"
    ipam:
      config:
        - subnet: ${AIFORGE_BOX_SUBNET:-10.251.250.0/24}
  out:
    enable_ipv6: false
    ipam:
      config:
        - subnet: ${AIFORGE_OUT_SUBNET:-10.251.251.0/24}
  # Only the UI front door and the allowlist's controller.
  admin:
    internal: true
    enable_ipv6: false

volumes:
  aiforge-state:
  egress-policy:
