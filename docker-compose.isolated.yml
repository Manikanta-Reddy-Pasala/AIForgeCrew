# AIForge — ISOLATED NETWORK mode: `./run.sh --isolated`.
#
# The default `docker-compose.yml` runs the box with `network_mode: host`: it
# shares this machine's network stack, so the egress allowlist in
# `aiforge_core/net/egress.py` is the ONLY thing between the agent and the
# internet — and that list only governs DECLARED destinations (Jira, GitLab,
# SMTP, MCP, telemetry) and page fetches. A `curl` typed into the agent's shell
# never passes through it.
#
# This file is the network-level answer, and it is a REPLACEMENT base rather
# than an overlay: compose cannot take `network_mode: host` back off once the
# default file has set it (declaring `networks:` alongside it is an error), so
# `--isolated` selects this file INSTEAD of docker-compose.yml.
#
# The shape:
#   box    an `internal` network — no route to the internet at all.
#   out    an ordinary bridge, reachable from the host and the world.
#   egress the ONLY thing on both. A proxy holding the allowlist; the box's
#          http_proxy/https_proxy point at it, so every outbound request either
#          matches a listed host or is refused by something the agent cannot
#          talk its way past.
#   ui     also on both, publishing the UI to the host's loopback — the box
#          itself cannot publish a port, because a container on an internal
#          network is not reachable from outside it.
#
#   egress-ctl  owns the allowlist, OUTSIDE the box: you change it in Settings
#          (the browser reaches it through `ui`, which refuses the box's own
#          network), the agent cannot reach it. Each entry allows that host and
#          its subdomains, anchored — `pypi.org` never matches `evilpypi.org`.
#   model  relays to the model endpoint ONLY (one host:port, no proxy): the
#          model client talks to it directly. run.sh points the box's model URL
#          at it and the relay at your real endpoint (AIFORGE_MODEL_UPSTREAM);
#          an endpoint on this machine's loopback must also listen where docker
#          can reach it (0.0.0.0 or the docker bridge), or use its LAN address.
#
# Do NOT add host.docker.internal to the allowlist: that opens EVERY port on
# this machine to the box (its own UI and API included), not just the model.
services:
  aiforge:
    build:
      context: .
      network: host
      args:
        BASE_REGISTRY: ${AIFORGE_BASE_REGISTRY:-}
        APT_MIRROR: ${AIFORGE_APT_MIRROR:-}
        APP_UID: ${AIFORGE_UID:-1000}
        APP_GID: ${AIFORGE_GID:-1000}
        APP_USER: ${AIFORGE_USER:-aiforge}
        APP_HOME: ${AIFORGE_HOME:-/home/aiforge}
    image: aiforge-sandbox:local
    container_name: aiforge
    restart: unless-stopped
    networks: [box]
    environment:
      # The box listens on its internal network so `ui` can reach it; nothing
      # else can (the network is internal and only `ui` publishes a port, on
      # ${AIFORGE_HOST}, loopback by default). On 127.0.0.1 the UI was dead.
      - AIFORGE_RUN_ARGS=--host 0.0.0.0 ${AIFORGE_RUN_ARGS:-}
      - AIFORGE_ALLOW_UNAUTH_NONLOOPBACK=${AIFORGE_ALLOW_UNAUTH_NONLOOPBACK:-1}
      - AIFORGE_MOUNTS
      - AIFORGE_APT_MIRROR
      # The model through the relay (run.sh sets AIFORGE_BOX_LM_URL).
      - AIFORGE_LM_BASE_URL=${AIFORGE_BOX_LM_URL:-http://model:1234/v1}
      - AIFORGE_DEFAULT_BASE_URL=${AIFORGE_BOX_LM_URL:-http://model:1234/v1}
      - AIFORGE_OPENAI_COMPAT_BASE_URL=${AIFORGE_BOX_LM_URL:-http://model:1234/v1}
      - AIFORGE_ISOLATED=1
      - AIFORGE_API_TOKEN
      - AIFORGE_ROLE
      - AIFORGE_ADMIN_URL
      - AIFORGE_SYNC_GROUP
      - AIFORGE_EXTRAS
      - AIFORGE_EMBED_BACKEND
      - AIFORGE_RUNNER_POLL_SEC
      - AIFORGE_NPM_REGISTRY
      - UV_DEFAULT_INDEX
      - npm_config_registry
      # EVERY outbound connection goes through the gatekeeper. Set here, not
      # passed through from the host: in this mode they are not the operator's
      # preference, they are the boundary.
      - http_proxy=http://egress:8888
      - https_proxy=http://egress:8888
      - HTTP_PROXY=http://egress:8888
      - HTTPS_PROXY=http://egress:8888
      - no_proxy=localhost,127.0.0.1,aiforge,egress,ui,model
      - NO_PROXY=localhost,127.0.0.1,aiforge,egress,ui,model
    volumes:
      - ${AIFORGE_CONFIG_DIR:-~/.aiforge}:${AIFORGE_HOME:-/home/aiforge}/.aiforge
      - aiforge-state:/var/lib/aiforge

  # The allowlist, enforced where the agent cannot argue with it. Shape:
  # docker/tinyproxy.conf (static, read-only). Policy: /policy/allow.txt,
  # written only by egress-ctl.
  egress:
    image: ${AIFORGE_PROXY_IMAGE:-vimagick/tinyproxy}
    container_name: aiforge-egress
    restart: unless-stopped
    networks: [box, out]
    volumes:
      - ./docker/tinyproxy.conf:/etc/tinyproxy/tinyproxy.conf:ro
      - egress-policy:/policy:ro

  # Owns the allowlist (docker/egress-controller.py). Not on the box network:
  # the agent has no route to it. Shares the proxy's process namespace so it
  # can tell it to re-read the list the moment Settings changes it.
  egress-ctl:
    image: ${AIFORGE_EGRESS_CTL_IMAGE:-python:3.12-alpine}
    container_name: aiforge-egress-ctl
    restart: unless-stopped
    networks: [out]
    pid: "service:egress"
    command: ["python3", "-u", "/app/egress-controller.py"]
    environment:
      # First start only: seeds the list. After that Settings owns it.
      - AIFORGE_EGRESS_ALLOW_HOSTS
    volumes:
      - ./docker/egress-controller.py:/app/egress-controller.py:ro
      - egress-policy:/policy

  # The model endpoint, and nothing else, for the box: one fixed upstream.
  model:
    image: ${AIFORGE_RELAY_IMAGE:-alpine/socat}
    container_name: aiforge-model
    restart: unless-stopped
    networks: [box, out]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["TCP-LISTEN:${AIFORGE_MODEL_PORT:-1234},fork,reuseaddr",
              "TCP:${AIFORGE_MODEL_UPSTREAM:-host.docker.internal:1234}"]

  # A container on an internal network cannot publish a port, so the UI is
  # served through here instead of from the box directly.
  ui:
    image: ${AIFORGE_UI_PROXY_IMAGE:-nginx:alpine}
    container_name: aiforge-ui
    restart: unless-stopped
    networks: [box, out]
    ports:
      - "${AIFORGE_HOST:-127.0.0.1}:${AIFORGE_PORT:-8799}:8799"
    environment:
      - AIFORGE_BOX_SUBNET=${AIFORGE_BOX_SUBNET:-10.251.250.0/24}
    volumes:
      # Static config, versioned with the repo rather than generated at start-up.
      - ./docker/ui-proxy.conf.template:/etc/nginx/templates/default.conf.template:ro

networks:
  box:
    internal: true
    # Fixed so the UI front door can refuse the box by address
    # (docker/ui-proxy.conf.template denies this subnet on /egress-admin/).
    ipam:
      config:
        - subnet: ${AIFORGE_BOX_SUBNET:-10.251.250.0/24}
  out: {}

volumes:
  aiforge-state:
  egress-policy:
