[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiforgecrew"
version = "0.1.0"
description = "AIForgeCrew — autonomous AI dev team orchestrator (single-Postgres runtime)"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.2",
  "pymongo>=4.6",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.8",
  "httpx>=0.27",
  "openai>=1.50",
  "numpy>=1.26",
  # Phase 1 — smolagents Doer
  "smolagents>=1.13",
  "litellm>=1.40",
  # Phase 2 — LlamaIndex RAG
  "llama-index-core>=0.12.0",
  "llama-index-vector-stores-postgres>=0.3.0",
  "llama-index-embeddings-openai>=0.3.0",
  "llama-index-retrievers-bm25>=0.5.0",
  # Phase 3 — LangGraph orchestrator (kept for back-compat; Phase 11 removes)
  "langgraph>=0.3.0",
  "langgraph-checkpoint-postgres>=2.0.0",
  # Phase 9 — Google ADK orchestrator (replaces LangGraph)
  "google-adk==1.31.1",
  # codemem (plan 1+) — Neo4j store driver
  "neo4j>=5.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["aiforge_core*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests/python", "aiforge_core/codemem/tests"]
addopts = "-ra"
markers = [
    "live_sidecar: requires embed/rerank sidecars running",
    "live_neo4j: requires Neo4j running at AIFORGE_NEO4J_URI",
    "live_llm: requires planner LLM at AIFORGE_INTENT_LM_URL",
    "live_repomix: requires `repomix` binary on PATH",
]

[project.scripts]
aiforge-codemem = "aiforge_core.codemem.api.cli:main"
