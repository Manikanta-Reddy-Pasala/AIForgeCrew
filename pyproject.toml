[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiforgecrew"
version = "0.1.0"
description = "AIForgeCrew — autonomous AI dev team orchestrator (single-Postgres runtime)"
requires-python = ">=3.11"
dependencies = [
  # Core runtime — required for the new aiforge_agents pipeline + UI.
  "psycopg[binary]>=3.2",
  "pymongo>=4.6",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.8",
  "httpx>=0.27",
  "openai>=1.50",
  "numpy>=1.26",
  "litellm>=1.40",
  # ADK 2.x — drives the v6 SequentialAgent[Planner, Verifier,
  # LoopAgent[Doer, Feedback], Learner] in runtime.adk_runner.
  "google-adk>=2.1.0",
  "aiforge-memory @ git+https://github.com/Manikanta-Reddy-Pasala/AiForgeMemory.git@main",
  # Doer runtime tools: execute_ipython_cell (jupyter kernel) + browse
  # (playwright). Declared here so `uv sync` stops pruning them — they
  # were previously hand-installed on the host and vanished on every sync.
  "jupyter-client>=8.6",
  "ipykernel>=6.29",
  "playwright>=1.44",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]
xlsx = ["openpyxl>=3.1"]

[project.scripts]
aiforge-agents-tb = "aiforge_core.memory.trial_balance:main"

[tool.setuptools.packages.find]
include = ["aiforge_core*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-ra"
markers = [
    "live_sidecar: requires embed/rerank sidecars running",
    "live_neo4j: requires Neo4j running at AIFORGE_NEO4J_URI",
    "live_llm: requires planner LLM at AIFORGE_INTENT_LM_URL",
    "live_repomix: requires `repomix` binary on PATH",
]
