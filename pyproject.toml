[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiforgecrew"
version = "0.1.0"
description = "AIForgeCrew orchestrator (Paperclip) + config validators"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
  "yamllint>=1.35",
]
mem = [
  "mempalace",
  "chromadb>=0.5",
]
rag = [
  "chromadb>=0.5",
  "markdown-it-py>=3.0",
]

[project.scripts]
aiforge = "aiforge_core.cli:main"

[tool.setuptools.packages.find]
include = ["aiforge_core*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-ra"
