[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiforgecrew"
version = "0.1.0"
description = "AIForgeCrew — autonomous AI dev team orchestrator (single-Postgres runtime)"
requires-python = ">=3.11"
dependencies = [
  # Core runtime — required for the new aiforge_agents pipeline + UI.
  "psycopg[binary]>=3.2",
  "pymongo>=4.6",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.8",
  "httpx>=0.27",
  "openai>=1.50",
  "numpy>=1.26",
  "litellm>=1.40",
  "aiforge-memory @ git+https://github.com/Manikanta-Reddy-Pasala/AiForgeMemory.git@main",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]
xlsx = ["openpyxl>=3.1"]
# Legacy stack — used only by deprecated runtime/api.py chat endpoint
# + aiforge_core/{planner,doer,intent,context,legacy} packages. New
# code MUST NOT import these. Install only when running the legacy
# UI chat / GA workflow.
legacy = [
  "smolagents>=1.13",
  "google-adk==1.31.1",
  "langgraph>=0.3.0",
  "langgraph-checkpoint-postgres>=2.0.0",
  "llama-index-core>=0.12.0",
  "llama-index-vector-stores-postgres>=0.3.0",
  "llama-index-embeddings-openai>=0.3.0",
  "llama-index-retrievers-bm25>=0.5.0",
]

[project.scripts]
aiforge-agents-run = "aiforge_core.aiforge_agents.orchestrator.run_ticket:main"
aiforge-agents-tb  = "aiforge_core.aiforge_agents.processes.trial_balance:main"

[tool.setuptools.packages.find]
include = ["aiforge_core*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-ra"
markers = [
    "live_sidecar: requires embed/rerank sidecars running",
    "live_neo4j: requires Neo4j running at AIFORGE_NEO4J_URI",
    "live_llm: requires planner LLM at AIFORGE_INTENT_LM_URL",
    "live_repomix: requires `repomix` binary on PATH",
]
