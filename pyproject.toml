[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiforgecrew"
version = "0.1.1"
description = "AIForgeCrew — autonomous AI dev team orchestrator (single-Postgres runtime)"
requires-python = ">=3.11"
dependencies = [
  # Core runtime — required for the new aiforge_agents pipeline + UI.
  "psycopg[binary]>=3.2",
  "pymongo>=4.6",
  "croniter>=2.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.9",
  "pydantic>=2.8",
  "httpx>=0.27",
  "openai>=1.50",
  "numpy>=1.26",
  "litellm>=1.40",
  # ADK 2.x — drives the v6 SequentialAgent[Planner, Verifier,
  # LoopAgent[Doer, Feedback], Learner] in runtime.adk_runner.
  # Pinned: 2.3.x added a Workflow validation that rejects the v6 graph
  # (chat-mode agents following a gate, e.g. doer after triage_gate),
  # breaking build_pipeline. 2.1.x builds the graph correctly. Revisit
  # when the graph is reworked for the newer constraint.
  "google-adk>=2.1.0,<2.2",
  # Vendored into packages/aiforge_memory/ (was a git dependency); resolved
  # from the local path via [tool.uv.sources] below.
  "aiforge-memory",
  # Code-graph memory: tree-sitter AST parsing for the symbol index +
  # repo-map (aiforge_core/indexing/treesitter_ingest.py, memory/rag/indexer).
  # These were hand-installed on the dev host and vanished on `uv sync`,
  # silently degrading the symbol/AST layer — declare them so every memory
  # bit ships. Core+grammar wheels are ABI-matched by uv's resolver.
  "tree-sitter>=0.21",
  "tree-sitter-java>=0.21",
  "tree-sitter-python>=0.21",
  # Multi-language symbol ingest (kotlin/python/react/c/cpp). The generic
  # tag-query engine (aider.repomap.RepoMap.get_tags_raw) drives
  # treesitter_ingest._parse_via_tags — it reuses aider's bundled tree-sitter
  # tags queries via grep-ast's filename_to_lang + the tree-sitter-language-pack
  # grammars, so we don't hand-write a per-language AST walker. Declared so
  # `uv sync` can't prune them out from under the symbol layer.
  "aider-chat>=0.86",
  "grep-ast>=0.9",
  "tree-sitter-language-pack>=0.13",
  # Doer runtime tools: execute_ipython_cell (jupyter kernel) + browse
  # (playwright). Declared here so `uv sync` stops pruning them — they
  # were previously hand-installed on the host and vanished on every sync.
  "jupyter-client>=8.6",
  "ipykernel>=6.29",
  "playwright>=1.44",
  # Chat file attachments — extract text from pdf / xlsx / docx so the agent
  # can read documents (pure-python, lightweight).
  "pypdf>=4.2",
  "openpyxl>=3.1",
  "python-docx>=1.1",
]

[tool.uv.sources]
# aiforge-memory is vendored in-repo (packages/aiforge_memory/) rather than
# pulled from its own git repo. uv installs it editable from this path.
aiforge-memory = { path = "packages/aiforge_memory", editable = true }

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]
xlsx = ["openpyxl>=3.1"]
# Integration adapters (aiforge_core/integrations/) — each optional; domain
# code degrades gracefully when absent. See integrations/__init__.py.
structured = ["instructor>=1.3"]                  # pydantic-validated LLM output
crawl = ["crawl4ai>=0.4"]                         # URL → markdown dossiers
# BASE chonkie only (RecursiveChunker, no tree-sitter): structure-aware text
# chunking for files/docs sent to the LLM + memory doc ingestion. The
# CodeChunker variant stays blocked by aider's tree-sitter-language-pack pin.
chunking = ["chonkie>=1.0"]
# LOCAL semantic memory: a sentence-transformer embedder (real paraphrase
# recall) + the sqlite-vec ANN index (fast KNN vs the O(N) hash-cosine scan).
# Selected by AIFORGE_EMBED_BACKEND=semantic; both run entirely on-box, no
# network. Without this extra the dependency-free hash backend is used.
semantic = ["sentence-transformers>=2.2", "sqlite-vec>=0.1"]
# tracing needs NO extra: the langfuse mirror posts to the REST ingestion
# API with core httpx (the SDK's pins conflict with aider-chat).
# NOTE: ragas (RAG eval, scripts/rag_eval.py + integrations/ragas_adapter.py)
# is intentionally NOT an extra: its langchain pins conflict with aider-chat
# in one resolution universe. Run it as a dev-tool overlay instead:
#   uv run --with 'ragas<0.4' --with 'langchain-openai<1' python scripts/rag_eval.py

[project.scripts]
aiforge-agents-tb = "aiforge_core.memory.trial_balance:main"
aiforge-tool = "aiforge_core.runtime.tool_cli:main"
aiforge-memory-claude = "aiforge_core.memory.claude_ingest:main"

[tool.setuptools.packages.find]
include = ["aiforge_core*"]

[tool.setuptools.package-data]
# Bundle the default skill/workflow playbooks so they ship in a wheel install,
# not just the repo checkout (ensure_dirs seeds them on first run).
"aiforge_core" = [
    "runtime/builtin_playbooks/skills/*.md",
    "runtime/builtin_playbooks/workflows/*.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-ra"
markers = [
    "live_sidecar: requires embed/rerank sidecars running",
    "live_neo4j: requires Neo4j running at AIFORGE_NEO4J_URI",
    "live_llm: requires planner LLM at AIFORGE_INTENT_LM_URL",
    "live_repomix: requires `repomix` binary on PATH",
]
