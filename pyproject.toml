[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiforgecrew"
version = "0.1.0"
description = "AIForgeCrew — autonomous AI dev team orchestrator (single-Postgres runtime)"
requires-python = ">=3.11"
dependencies = [
  # Core runtime — required for the new aiforge_agents pipeline + UI.
  "psycopg[binary]>=3.2",
  "pymongo>=4.6",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.8",
  "httpx>=0.27",
  "openai>=1.50",
  "numpy>=1.26",
  "litellm>=1.40",
  "aiforge-memory @ git+https://github.com/Manikanta-Reddy-Pasala/AiForgeMemory.git@main",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]
xlsx = ["openpyxl>=3.1"]
# Legacy ADK 2.0b1 dependency — required by the runtime/adk_workflow.py
# orchestrator path. Will be retired once the entire pipeline cuts over
# to aiforge_core/aiforge_agents/orchestrator/run_ticket.py.
legacy = [
  "google-adk==2.0.0b1",
]

[project.scripts]
aiforge-agents-run = "aiforge_core.aiforge_agents.orchestrator.run_ticket:main"
aiforge-agents-tb  = "aiforge_core.aiforge_agents.processes.trial_balance:main"

[tool.setuptools.packages.find]
include = ["aiforge_core*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-ra"
markers = [
    "live_sidecar: requires embed/rerank sidecars running",
    "live_neo4j: requires Neo4j running at AIFORGE_NEO4J_URI",
    "live_llm: requires planner LLM at AIFORGE_INTENT_LM_URL",
    "live_repomix: requires `repomix` binary on PATH",
]
