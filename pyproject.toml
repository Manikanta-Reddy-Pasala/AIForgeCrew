[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiforgecrew"
version = "0.1.0"
description = "AIForgeCrew — autonomous AI dev team orchestrator (single-Postgres runtime)"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.8",
  "httpx>=0.27",
  "openai>=1.50",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["aiforge_core*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-ra"
markers = [
    "live_sidecar: requires embed/rerank sidecars running",
]
