[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiforgecrew"
version = "0.1.1"
description = "AIForgeCrew — autonomous AI dev team orchestrator (single-SQLite runtime)"
# Capped below 3.14: scipy/numpy (and other native deps) ship no 3.14 wheels
# yet, so a 3.14 interpreter forces a from-source build that fails (meson).
requires-python = ">=3.11,<3.14"
dependencies = [
  # Core runtime — required for the new aiforge_agents pipeline + UI.
  # (pymongo was declared here and imported by NOTHING — no `import pymongo`
  # anywhere in aiforge_core, scripts or packages. The only "mongo" strings in
  # the tree are topic keywords in the docs index and repo-notes, which
  # describe OTHER people's codebases. Removed with dnspython, its only
  # transitive dep. This build is SQLite-only.)
  "croniter>=2.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.9",
  "pydantic>=2.8",
  "httpx>=0.27",
  "openai>=1.50",
  "numpy>=1.26",
  "litellm>=1.40",
  # sqlite-vec provides the vec0 virtual table that backs semantic memory recall
  # (the production default, AIFORGE_EMBED_BACKEND != hash). Core, not an extra:
  # without it every memory write hit "no such module: vec0". The code now
  # degrades to a keyword/brute-force scan if it is somehow absent, but the
  # semantic path is the intended one, so ship the extension by default.
  "sqlite-vec>=0.1",
  # ADK 2.x — drives the v6 SequentialAgent[Planner, Verifier,
  # LoopAgent[Doer, Feedback], Learner] in runtime.adk_runner.
  # Pinned: 2.3.x added a Workflow validation that rejects the v6 graph
  # (chat-mode agents following a gate, e.g. doer after triage_gate),
  # breaking build_pipeline. 2.1.x builds the graph correctly. Revisit
  # when the graph is reworked for the newer constraint.
  "google-adk>=2.1.0,<2.2",
  # Vendored into packages/aiforge_memory/ (was a git dependency); resolved
  # from the local path via [tool.uv.sources] below.
  "aiforge-memory",
  # tree-sitter AST parsing behind the vendored RepoMap (aiforge_core/memory/
  # code_context.aider_digest) + memory/rag/indexer. Declared so `uv sync`
  # can't prune them. Core+grammar wheels are ABI-matched by uv's resolver.
  "tree-sitter>=0.21",
  "tree-sitter-java>=0.21",
  "tree-sitter-python>=0.21",
  # The ranked repo digest (aiforge_core/indexing/repomap/, vendored from
  # aider-chat 0.86.2 under Apache-2.0) needs exactly these: grep-ast's
  # filename_to_lang + TreeContext, the tree-sitter-language-pack grammars,
  # PageRank from networkx, the tags cache from diskcache and pygments for the
  # lexer fallback on languages with no tree-sitter grammar. Declared so
  # `uv sync` can't prune them out from under RepoMap. aider-chat itself is
  # NOT a dependency — see aiforge_core/indexing/repomap/_vendor_repomap.py.
  "grep-ast>=0.9",
  "tree-sitter-language-pack>=0.13",
  "networkx>=3.2",
  "diskcache>=5.6",
  "pygments>=2.20",
  # Doer runtime tools: execute_ipython_cell (jupyter kernel) + browse
  # (playwright). Declared here so `uv sync` stops pruning them — they
  # were previously hand-installed on the host and vanished on every sync.
  "jupyter-client>=8.6",
  "ipykernel>=6.29",
  "playwright>=1.44",
  # Chat file attachments — extract text from pdf / xlsx / docx so the agent
  # can read documents (pure-python, lightweight).
  "pypdf>=4.2",
  "openpyxl>=3.1",
  "python-docx>=1.1",
  # Structured PDF tables (grid cells, not just flat text). Optional at runtime
  # — extract_text degrades to pypdf's flat text when it's unavailable.
  "pdfplumber>=0.11",
]

# ── Security overrides (CVE remediation) ─────────────────────────────
# HISTORY: aider-chat 0.86.2 EXACT-PINNED a cohort of libraries (litellm,
# aiohttp, starlette, urllib3, pillow, gitpython, requests, idna, soupsieve,
# python-dotenv) and 0.86.2 was its newest release, so there was no upgrade
# path through it — those pins held two CRITICAL litellm CVEs
# (CVE-2026-35030, CVE-2026-49468) plus ~60 HIGH findings Trivy reported
# against uv.lock. This whole block existed to force past them.
#
# aider-chat has since been REMOVED as a dependency (its one useful part, the
# tree-sitter + PageRank RepoMap, is vendored under
# aiforge_core/indexing/repomap/), so its pins no longer constrain anything.
#
# MEASURED after that removal (empty the list, re-resolve, diff the lock):
# only `starlette` still CHANGES the resolution — everything else now lands on
# the same version from our own direct constraints, and `gitpython` has left
# the lock entirely (it was aider's). The rest are kept deliberately as FLOORS,
# not because they are load-bearing today: they cost nothing, and without them
# a future transitive pin can silently walk one of these back to a version with
# a known CVE. Do not prune them just because the diff is empty right now.
# Trivy reports 0 findings against uv.lock at every severity, before and after.
#
# litellm IS load-bearing for us directly (the ADK/team pipeline reaches the
# model through LiteLlm), so this is a real upgrade, not a paper one — it is
# covered by the full test suite.
[tool.uv]
override-dependencies = [
  "litellm>=1.84.0",
  # starlette <1.0 carried 2 HIGH CVEs and was held by fastapi 0.128's
  # `starlette<1.0.0` ceiling. fastapi 0.141 dropped that ceiling entirely
  # (`starlette>=0.46.0`), so the fix is to move fastapi forward rather than
  # to force starlette past a bound its own framework set.
  "fastapi>=0.141.1",
  "starlette>=1.1.0",
  "aiohttp>=3.14.3",
  # gitpython left the lock with aider-chat; the floor stays in case anything
  # pulls it back in.
  "gitpython>=3.1.49",
  "urllib3>=2.7.0",
  "pillow>=12.2.0",
  "soupsieve>=2.8.4",
  "requests>=2.33.0",
  "idna>=3.15",
  "python-dotenv>=1.2.2",
  # CVE-2026-4539. Not held by our own constraint — a transitive pin keeps it
  # back, so the override is the only lever.
  "pygments>=2.20.0",
]

[tool.uv.sources]
# aiforge-memory is vendored in-repo (packages/aiforge_memory/) rather than
# pulled from its own git repo. uv installs it editable from this path.
aiforge-memory = { path = "packages/aiforge_memory", editable = true }

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]
xlsx = ["openpyxl>=3.1"]
# Integration adapters (aiforge_core/integrations/) — each optional; domain
# code degrades gracefully when absent. See integrations/__init__.py.
structured = ["instructor>=1.3"]                  # pydantic-validated LLM output
crawl = ["crawl4ai>=0.4"]                         # URL → markdown dossiers
# BASE chonkie only (RecursiveChunker, no tree-sitter): structure-aware text
# chunking for files/docs sent to the LLM + memory doc ingestion. The
# CodeChunker variant needs tree-sitter-language-pack>=1.x; we hold 0.13 for
# the vendored RepoMap's tag queries, so it stays out of scope.
chunking = ["chonkie>=1.0"]
# SEMANTIC memory: model2vec STATIC embeddings — real paraphrase recall, ~30 MB
# model, NO torch (pure numpy) + the sqlite-vec ANN index (fast KNN vs the O(N)
# hash-cosine scan). Selected by AIFORGE_EMBED_BACKEND=model2vec; loads from a
# local dir (AIFORGE_EMBED_MODEL2VEC_PATH) for zero-network runtime. Without this
# extra the dependency-free hash backend is used. (No sentence-transformers /
# torch — the ``api`` backend also gives semantic recall with zero local deps.)
embed-static = ["model2vec>=0.3", "sqlite-vec>=0.1"]
# tracing needs NO extra: the langfuse mirror posts to the REST ingestion
# API with core httpx (the SDK's pins conflicted with the old aider-chat dep).
# NOTE: ragas (RAG eval, scripts/rag_eval.py + integrations/ragas_adapter.py)
# is intentionally NOT an extra: its langchain pins conflicted with aider-chat
# in one resolution universe. Run it as a dev-tool overlay instead:
#   uv run --with 'ragas<0.4' --with 'langchain-openai<1' python scripts/rag_eval.py

[project.scripts]
# What the installed packages run. Every OS package is a thin wrapper around
# this one command, so the .deb, the .app and the .msi cannot drift apart.
aiforge = "aiforge_core.cli.serve:main"
aiforge-agents-tb = "aiforge_core.memory.trial_balance:main"
aiforge-tool = "aiforge_core.runtime.tool_cli:main"
aiforge-memory-instructions = "aiforge_core.memory.instructions_ingest:main"
aiforge-sync = "aiforge_core.memory.sync.loop:main"

[tool.setuptools.packages.find]
include = ["aiforge_core*"]

[tool.setuptools.package-data]
# Bundle the default skill/workflow playbooks so they ship in a wheel install,
# not just the repo checkout (ensure_dirs seeds them on first run).
"aiforge_core" = [
    "runtime/builtin_playbooks/skills/*.md",
    "runtime/builtin_playbooks/workflows/*.md",
    # Tree-sitter tag queries for the vendored RepoMap. get_scm_fname()
    # resolves these via importlib.resources, so a wheel WITHOUT them yields a
    # silently empty repo map rather than an error — they must ship.
    "indexing/repomap/queries/*/*.scm",
    "indexing/repomap/queries/*/README.md",
    # The built UI, copied in by installer/build_payload.sh. Absent in a plain
    # checkout — a repo run serves web/dist directly (see api.py's two
    # candidates), so this pattern matching nothing is normal there.
    "web_dist/**/*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Vendored third-party source (aider-chat, Apache-2.0 — see NOTICE). Kept
# byte-for-byte upstream apart from the shims listed in its docstring so it can
# be re-synced against a newer aider release; reformatting it to our rules would
# make every future diff unreadable. Our own wrapper (indexing/aider_map.py) IS
# linted.
extend-exclude = ["aiforge_core/indexing/repomap/_vendor_*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
# Live-only tests are deselected BY DEFAULT, here — not by whoever remembers
# to pass the right -m. A CI job running plain `pytest` (or an older -m
# line) otherwise runs the tmux / GA tests on a box that has neither and
# reports failures that mean nothing. Run them deliberately with
# `pytest -m live_tmux` — a -m on the command line replaces this one.
# (The graphify lookup tests used to need the repo's own gitignored
# graphify-out/; they now build a synthetic graph in tmp_path and run
# everywhere, so there is no live_graph marker any more.)
addopts = "-ra -m 'not live_sidecar and not live_llm and not live_repomix and not live_tmux and not live_jupyter and not live_ga and not live_aider'"
# A test that needs something not every box has is SELECTED by a marker, never
# by sniffing the host at runtime: `-m "not live_*"` deselects the same tests on
# every machine, while `skipif(shutil.which(...))` made the result depend on who
# ran it (a green run on a box missing the tool proved nothing, and a test could
# silently stop running everywhere). Anything DECLARED in this file — including
# the extras CI installs with --all-extras — is required, not probed.
#
# The marker still decides SELECTION. What changed (2026-08-27) is what happens
# when a pipeline passes its own -m and selects them anyway on a runner with no
# tmux binary / no GA checkout: those tests carry a skipif that reports
# "skipped: no tmux" instead of failing. A missing binary is not a regression
# and nobody can fix it by editing code — but the skip reason names it, so the
# tests cannot go quietly missing on a box that DOES have the tool.
markers = [
    "live_sidecar: requires embed/rerank sidecars running",
    "live_llm: requires planner LLM at AIFORGE_INTENT_LM_URL",
    "live_repomix: requires `repomix` binary on PATH",
    "live_tmux: requires the `tmux` binary on PATH",
    "live_jupyter: requires a runnable jupyter kernel on this host",
    "live_ga: requires the GA checkout (AIFORGE_GA_DIR / the NUC)",
    "live_aider: requires the tree-sitter grammars to map a synthetic repo",
]
