[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiforgecrew"
version = "0.1.0"
description = "AIForgeCrew — autonomous AI dev team orchestrator (single-Postgres runtime)"
requires-python = ">=3.11"
dependencies = [
  # Core runtime — required for the new aiforge_agents pipeline + UI.
  "psycopg[binary]>=3.2",
  "pymongo>=4.6",
  "croniter>=2.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.9",
  "pydantic>=2.8",
  "httpx>=0.27",
  "openai>=1.50",
  "numpy>=1.26",
  "litellm>=1.40",
  # ADK 2.x — drives the v6 SequentialAgent[Planner, Verifier,
  # LoopAgent[Doer, Feedback], Learner] in runtime.adk_runner.
  # Pinned: 2.3.x added a Workflow validation that rejects the v6 graph
  # (chat-mode agents following a gate, e.g. doer after triage_gate),
  # breaking build_pipeline. 2.1.x builds the graph correctly. Revisit
  # when the graph is reworked for the newer constraint.
  "google-adk>=2.1.0,<2.2",
  # Vendored into packages/aiforge_memory/ (was a git dependency); resolved
  # from the local path via [tool.uv.sources] below.
  "aiforge-memory",
  # Code-graph memory: tree-sitter AST parsing for the symbol index +
  # repo-map (aiforge_core/indexing/treesitter_ingest.py, memory/rag/indexer).
  # These were hand-installed on the dev host and vanished on `uv sync`,
  # silently degrading the symbol/AST layer — declare them so every memory
  # bit ships. Core+grammar wheels are ABI-matched by uv's resolver.
  "tree-sitter>=0.21",
  "tree-sitter-java>=0.21",
  "tree-sitter-python>=0.21",
  # Doer runtime tools: execute_ipython_cell (jupyter kernel) + browse
  # (playwright). Declared here so `uv sync` stops pruning them — they
  # were previously hand-installed on the host and vanished on every sync.
  "jupyter-client>=8.6",
  "ipykernel>=6.29",
  "playwright>=1.44",
  # Chat file attachments — extract text from pdf / xlsx / docx so the agent
  # can read documents (pure-python, lightweight).
  "pypdf>=4.2",
  "openpyxl>=3.1",
  "python-docx>=1.1",
]

[tool.uv.sources]
# aiforge-memory is vendored in-repo (packages/aiforge_memory/) rather than
# pulled from its own git repo. uv installs it editable from this path.
aiforge-memory = { path = "packages/aiforge_memory", editable = true }

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]
xlsx = ["openpyxl>=3.1"]

[project.scripts]
aiforge-agents-tb = "aiforge_core.memory.trial_balance:main"

[tool.setuptools.packages.find]
include = ["aiforge_core*"]

[tool.setuptools.package-data]
# Bundle the default skill/workflow playbooks so they ship in a wheel install,
# not just the repo checkout (ensure_dirs seeds them on first run).
"aiforge_core" = [
    "runtime/builtin_playbooks/skills/*.md",
    "runtime/builtin_playbooks/workflows/*.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-ra"
markers = [
    "live_sidecar: requires embed/rerank sidecars running",
    "live_neo4j: requires Neo4j running at AIFORGE_NEO4J_URI",
    "live_llm: requires planner LLM at AIFORGE_INTENT_LM_URL",
    "live_repomix: requires `repomix` binary on PATH",
]
