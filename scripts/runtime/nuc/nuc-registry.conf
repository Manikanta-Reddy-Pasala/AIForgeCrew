# NUC-only drop-in — installed once by install-system-boot.sh.
# install-system-boot will NOT overwrite an existing file here, so operator
# edits (and this box's public-index pin) survive re-runs of the installer.
#
# Artifactory is unreachable from the NUC without the corp VPN; point the
# sandbox at public PyPI / npm for the first-start install (compose bakes
# these at container creation).
[Service]
TimeoutStartSec=2400
Environment=UV_DEFAULT_INDEX=https://pypi.org/simple
Environment=PIP_INDEX_URL=https://pypi.org/simple
Environment=AIFORGE_NPM_REGISTRY=https://registry.npmjs.org/
Environment=npm_config_registry=https://registry.npmjs.org/
