[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiforge-graph-mcp"
version = "0.1.0"
description = "MCP stdio server exposing the AIForge Neo4j code graph + vector + k8s + ticket tools to LLMs."
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.2",
  "neo4j>=5.20",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "python-frontmatter>=1.1",
]

[project.scripts]
aiforge-graph-mcp = "aiforge_graph_mcp.server:main_entry"

[tool.setuptools.packages.find]
where = ["."]
include = ["aiforge_graph_mcp*"]
