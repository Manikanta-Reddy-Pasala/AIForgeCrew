# Overlay for Apple Silicon laptops: swap TEI to infinity (has arm64 build).
# Usage: docker compose -f docker-compose.yml -f docker-compose.arm64.yml up -d

services:
  embed:
    image: michaelf34/infinity:latest
    command: ["v2", "--model-id", "BAAI/bge-m3", "--port", "8764", "--engine", "torch"]

  rerank:
    image: michaelf34/infinity:latest
    command: ["v2", "--model-id", "BAAI/bge-reranker-v2-m3", "--port", "8765", "--engine", "torch"]
