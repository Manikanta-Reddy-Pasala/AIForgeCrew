# Regex patterns used by link_memories.py to surface code references in
# free-text memory files and docs. Named capture group is the link target.

patterns:
  file_path: '(?P<target>[A-Za-z0-9_\-/]+/[A-Za-z0-9_\-./]+\.(?:java|ts|tsx|js|jsx|py|yaml|yml|sql|md|proto))'
  java_fqn:  '(?P<target>[a-z][a-z0-9]*(?:\.[A-Za-z0-9_]+){2,}(?:#[A-Za-z0-9_]+)?)'
  mongo_coll: '\b(?P<target>(?:sales|salesReturn|saleOrder|salesQuotation|purchases|payments|expenses|businessProducts|Parties|productTxn|allTransactions|chartOfAccounts|sagaTransactions|employees|transactionSyncRules|changeStreamEventErrors|deliveryChallan|storeCategories|tallyRawVouchers|partnerRoles|PartnerBusinessGroups))\b'
  nats_subject: '(?P<target>(?:business|pendingToSync|changestream)\.[a-z\*]+(?:\.[a-z\*\{\}A-Z]+){0,4})'
  endpoint: '(?P<target>/(?:v\d+|api)/[A-Za-z0-9/_\-{}:.]+)'
  repo_name: '\b(?P<target>PosClientBackend|PosServerBackend|MongoDbService|PosAdmin|PosFrontend|PosPythonBackend|BusinessService|GatewayService|Scheduler|QuartzScheduler|TallyConnector|PosDataSyncService|CacheLayer|NotificationService|EmailService|WhatsappApiService|GstApiService|AIForgeCrew)\b'
  redis_key: '(?P<target>(?:lock|shedlock|changestream):[a-zA-Z0-9\.\-_:\{\}\*]+)'

# Optional: confidence per kind (used by link_memories to weight edges).
confidence:
  file_path: 0.9
  java_fqn: 0.8
  mongo_coll: 0.7
  nats_subject: 0.85
  endpoint: 0.75
  repo_name: 0.6
  redis_key: 0.8
