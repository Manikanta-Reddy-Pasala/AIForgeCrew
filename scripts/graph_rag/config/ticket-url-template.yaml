# Custom ticket URL provider config.
# id_pattern validates id format; fields map API JSON -> normalized keys.
# Auth token read from env var api_auth_env if set.

providers:
  default:
    url_template: "https://app.example.com/tickets/{id}"
    api_template: "https://app.example.com/api/v1/tickets/{id}"
    api_auth_env: "TICKET_API_TOKEN"
    id_pattern: '^[A-Z]+-\d+$'
    fields:
      title: "title"
      body: "description"
      status: "status"
      assignee: "assignee.name"
      labels: "labels"

  linear:
    url_template: "https://linear.app/oneshell/issue/{id}"
    api_template: "https://api.linear.app/graphql"
    api_auth_env: "LINEAR_API_TOKEN"
    id_pattern: '^[A-Z]+-\d+$'
    method: POST
    body_template: '{"query":"query($id:String!){issue(id:$id){title description state{name} assignee{name} labels{nodes{name}}}}","variables":{"id":"{id}"}}'
    fields:
      title: "data.issue.title"
      body: "data.issue.description"
      status: "data.issue.state.name"
      assignee: "data.issue.assignee.name"
