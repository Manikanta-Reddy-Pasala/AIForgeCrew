# Self-hosted Langfuse v2 — SIMPLEST setup: one app container + postgres.
# Purpose here is narrow: BROWSE the agents' LLM calls (input messages +
# responses per role). v2 does that fully; v3 would add clickhouse + redis +
# minio + a worker (6 containers) for analytics we don't need.
#
# Brought up by `./run.sh --with-langfuse` (or AIFORGE_LANGFUSE=1 in .env).
# Headless: org/project/API keys provisioned via LANGFUSE_INIT_* on first
# boot; run.sh generates secrets once into ~/.aiforge/langfuse.env and
# exports LANGFUSE_HOST/PUBLIC_KEY/SECRET_KEY so mirroring turns on
# automatically.
#
# DATA IS DELIBERATELY SHORT-LIVED (operator requirement: max 1 day, no
# forever storage, no log accrual):
#   - postgres has NO volume → all traces vanish on `down`/recreate
#   - the prune sidecar deletes rows older than LF_RETENTION_DAYS (default 1)
#     every hour while the stack runs
#   - container logs capped at 10MB × 1 file per service
#
# UI: http://localhost:${LF_PORT:-3005}  login: admin@aiforge.local / $LF_ADMIN_PASSWORD

x-logging: &logcap
  driver: json-file
  options: {max-size: "10m", max-file: "1"}

services:
  langfuse:
    logging: *logcap
    image: langfuse/langfuse:2
    restart: unless-stopped
    depends_on:
      langfuse-postgres:
        condition: service_healthy
    ports:
      - "${LF_PORT:-3005}:3000"
    environment:
      DATABASE_URL: postgresql://postgres:${LF_PG_PASSWORD}@langfuse-postgres:5432/postgres
      NEXTAUTH_URL: http://localhost:${LF_PORT:-3005}
      NEXTAUTH_SECRET: ${LF_NEXTAUTH_SECRET}
      SALT: ${LF_SALT}
      ENCRYPTION_KEY: ${LF_ENCRYPTION_KEY}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_LOG_LEVEL: warn
      # Headless first-boot provisioning — deterministic keys the app uses.
      LANGFUSE_INIT_ORG_ID: aiforge
      LANGFUSE_INIT_ORG_NAME: AIForge
      LANGFUSE_INIT_PROJECT_ID: aiforge
      LANGFUSE_INIT_PROJECT_NAME: AIForge
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LF_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LF_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: admin@aiforge.local
      LANGFUSE_INIT_USER_NAME: admin
      LANGFUSE_INIT_USER_PASSWORD: ${LF_ADMIN_PASSWORD}

  langfuse-postgres:
    logging: *logcap
    image: postgres:16-alpine
    restart: unless-stopped
    # NO volume on purpose: traces are ephemeral — gone on down/recreate.
    environment:
      POSTGRES_PASSWORD: ${LF_PG_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Hourly retention prune: rows older than LF_RETENTION_DAYS (default 1)
  # are deleted while the stack runs. Soft-fails per statement so a schema
  # difference can't kill the loop.
  langfuse-prune:
    logging: *logcap
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      langfuse-postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${LF_PG_PASSWORD}
      RETENTION_DAYS: ${LF_RETENTION_DAYS:-1}
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          sleep 3600
          for t in "observations|start_time" "scores|timestamp" "traces|timestamp"; do
            tbl="$${t%%|*}"; col="$${t##*|}"
            psql -h langfuse-postgres -U postgres -d postgres -c \
              "DELETE FROM \"$$tbl\" WHERE \"$$col\" < now() - interval '$${RETENTION_DAYS} days'" \
              || true
          done
        done
