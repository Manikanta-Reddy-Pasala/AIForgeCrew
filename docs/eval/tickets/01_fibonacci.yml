id: eval-01
role: sr-developer
prompt: |
  Write ONLY the body of `src/math_utils.py` with a function `fibonacci(n)`
  that returns the nth Fibonacci number. No explanation, just the code.
expected_tests: |
  from src.math_utils import fibonacci
  def test_base():
      assert fibonacci(0) == 0 and fibonacci(1) == 1
  def test_recursive():
      assert fibonacci(10) == 55
  def test_large():
      assert fibonacci(30) == 832040
