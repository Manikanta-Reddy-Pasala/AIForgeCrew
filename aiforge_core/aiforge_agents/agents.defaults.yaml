# Bundled archetype defaults. Override via ~/.aiforge/agents.yaml
# (global) or <repo>/.aiforge/agents.yaml (per-repo).
# Lookup order: per-repo > global > this file > BaseArchetype field defaults.

archetypes:
  understander:
    model: /Users/manikanta/.lmstudio/models/lmstudio-community/Qwen3-Coder-Next-MLX-4bit
    temperature: 0.3
    top_p: 0.9
    grammar: understanding.json
    max_tokens: 4096
    prompt_version: v1

  planner:
    model: /Users/manikanta/.lmstudio/models/lmstudio-community/Qwen3-Coder-Next-MLX-4bit   # reasoning model
    temperature: 0.3
    top_p: 0.9
    grammar: plan.gbnf
    # 12-step plans + json_object response_format need room. Was 6000;
    # at 12 steps the JSON envelope alone can hit 4-5k.
    max_tokens: 10000
    prompt_version: v1

  verifier:
    model: /Users/manikanta/.lmstudio/models/lmstudio-community/Qwen3-Coder-Next-MLX-4bit
    temperature: 0.0
    grammar: verify.json
    max_tokens: 2048
    prompt_version: v1

  grounder:
    model: ""                        # rule-based; LLM not used
    temperature: 0.0
    grammar: ground.json
    max_tokens: 1024
    prompt_version: v1

  doer:
    model: /Users/manikanta/.lmstudio/models/lmstudio-community/Qwen3-Coder-Next-MLX-4bit
    temperature: 0.2
    top_p: 0.95
    repetition_penalty: 1.05
    grammar: udiff.gbnf
    # 8000 fits a ~200-line README or a 100-line Java class with comfort.
    # If we still see truncation on bigger files, bump again or add
    # multi-step Doer that emits one file per LLM call.
    max_tokens: 12000
    prompt_version: v1

  validator:
    model: ""           # heuristic-only in P1; LLM optional later
    temperature: 0.0
    max_tokens: 1024
    prompt_version: v1

  tester:
    model: /Users/manikanta/.lmstudio/models/lmstudio-community/Qwen3-Coder-Next-MLX-4bit
    temperature: 0.1
    top_p: 0.9
    grammar: tests.json
    max_tokens: 4000
    prompt_version: v1

  architect:
    model: /Users/manikanta/.lmstudio/models/lmstudio-community/Qwen3-Coder-Next-MLX-4bit
    temperature: 0.0
    grammar: review.json
    max_tokens: 4000
    prompt_version: v1

  coordinator:
    model: /Users/manikanta/.lmstudio/models/lmstudio-community/Qwen3-Coder-Next-MLX-4bit
    temperature: 0.2
    max_tokens: 4096
    prompt_version: v1

  learner:
    model: ""                        # heuristic by default; override for distillation
    temperature: 0.0
    max_tokens: 2048
    prompt_version: v1
