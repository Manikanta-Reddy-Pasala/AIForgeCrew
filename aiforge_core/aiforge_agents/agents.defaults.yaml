# Bundled archetype defaults. Override via ~/.aiforge/agents.yaml
# (global) or <repo>/.aiforge/agents.yaml (per-repo).
# Lookup order: per-repo > global > this file > BaseArchetype field defaults.

# Mac Studio Qwen3-Coder-Next-MLX-4bit runs with a 128–256K context
# window. We give every stage a generous output budget so JSON envelopes
# / udiffs / review bodies are never truncated. Inputs always fit.
archetypes:
  understander:
    model: /Users/manikanta/.lmstudio/models/lmstudio-community/Qwen3-Coder-Next-MLX-4bit
    temperature: 0.3
    top_p: 0.9
    grammar: understanding.json
    max_tokens: 8000
    prompt_version: v1

  planner:
    model: /Users/manikanta/.lmstudio/models/lmstudio-community/Qwen3-Coder-Next-MLX-4bit   # reasoning model
    temperature: 0.3
    top_p: 0.9
    grammar: plan.gbnf
    # 12-step plans easily emit 8–10k JSON; give 24k headroom.
    max_tokens: 24000
    prompt_version: v1

  verifier:
    model: /Users/manikanta/.lmstudio/models/lmstudio-community/Qwen3-Coder-Next-MLX-4bit
    temperature: 0.0
    grammar: verify.json
    max_tokens: 4000
    prompt_version: v1

  grounder:
    model: ""                        # rule-based; LLM not used
    temperature: 0.0
    grammar: ground.json
    max_tokens: 1024
    prompt_version: v1

  doer:
    model: /Users/manikanta/.lmstudio/models/lmstudio-community/Qwen3-Coder-Next-MLX-4bit
    temperature: 0.2
    top_p: 0.95
    repetition_penalty: 1.05
    grammar: udiff.gbnf
    # 24k fits a 500-line Java class or a long README. Hardly hit even
    # so. If we add multi-class single-step generation later, bump.
    max_tokens: 24000
    prompt_version: v1

  validator:
    model: ""           # heuristic-only in P1; LLM optional later
    temperature: 0.0
    max_tokens: 1024
    prompt_version: v1

  tester:
    model: /Users/manikanta/.lmstudio/models/lmstudio-community/Qwen3-Coder-Next-MLX-4bit
    temperature: 0.1
    top_p: 0.9
    grammar: tests.json
    max_tokens: 12000
    prompt_version: v1

  architect:
    model: /Users/manikanta/.lmstudio/models/lmstudio-community/Qwen3-Coder-Next-MLX-4bit
    temperature: 0.0
    grammar: review.json
    max_tokens: 12000
    prompt_version: v1

  coordinator:
    model: /Users/manikanta/.lmstudio/models/lmstudio-community/Qwen3-Coder-Next-MLX-4bit
    temperature: 0.2
    max_tokens: 8000
    prompt_version: v1

  learner:
    model: ""                        # heuristic by default; override for distillation
    temperature: 0.0
    max_tokens: 4000
    prompt_version: v1
