# The egress proxy's shape (`./run.sh --isolated`). Static and versioned: the
# box cannot edit it (it used to be written into ~/.aiforge, which the box can
# write). The POLICY — which hosts — is /policy/allow.txt, owned by the egress
# controller outside the box and changed from Settings.
Port 8888
Listen 0.0.0.0
Timeout 600
LogLevel Notice
# Only TLS tunnels: CONNECT to any other port (ssh, a database) is refused.
ConnectPort 443
# Default-deny: a host not matched by a line of the allow file is refused.
# Each line is an anchored pattern written by the controller.
FilterURLs Off
FilterExtended On
FilterDefaultDeny Yes
Filter "/policy/allow.txt"
