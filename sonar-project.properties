sonar.projectKey=aiforgecrew
sonar.projectName=AIForgeCrew
# EVERYTHING, not just aiforge_core+scripts. The CI template already scans
# the whole tree (its report carries findings from packages/, docs/,
# services/ and web/), so a narrower list here only meant a local scan
# could report zero on files CI was still failing. Same scope, same answer.
sonar.sources=.
sonar.tests=tests

# The shared CI template runs the scanner from the project root and can set
# sonar.sources itself (`.`), which puts tests/ in the MAIN set while
# sonar.tests also claims it — that is the "File tests/__init__.py can't be
# indexed twice" failure. Excluding tests/** from the main set makes the two
# sets disjoint no matter what sources ends up being; sonar.tests above still
# indexes them as tests.
# aiforge_core/indexing/repomap/_vendor_*.py is VENDORED third-party source
# (aider-chat, Apache-2.0 — see NOTICE). It is kept byte-for-byte upstream so it
# can be re-synced, so its findings are not ours to fix and reformatting it
# would make every future diff unreadable. Excluded here for the same reason
# ruff's extend-exclude skips it. Our own wrapper, indexing/aider_map.py, IS
# analysed. The queries/*.scm tag files are data, not code.
# packages/*/build/lib/** is setuptools' staging copy of a package that is
# already indexed at its real path — every finding in it is the same finding
# reported twice, against a directory `make clean` deletes.
# **/tests/fixtures/** is deliberately-imperfect sample source (Python, Java,
# Go, TS) that exists to be PARSED by the tree-sitter walker. An unused field
# or a parameter nobody reads is the test input; fixing it changes what the
# walker is being tested against.
# aiforge_core/web_dist is the SAME build output as web/dist, staged into the
# package by installer/build_payload.sh so an installed wheel can serve the UI.
# It is not tracked and not editable: fixing anything in it means fixing web/
# and rebuilding. Analysing it reports every finding twice, against a path
# nobody can patch.
# test-results/ and sonar/ hold the BUILD'S OWN OUTPUT — junit.xml, coverage.xml
# — which the scanner would otherwise index as XML source and raise findings on.
# They are still READ as reports: sonar.python.*.reportPath below resolves a
# report by path, independently of what is indexed as source.
sonar.exclusions=**/node_modules/**,**/.venv/**,**/.worktrees/**,**/web/dist/**,**/web_dist/**,**/build/lib/**,**/tests/fixtures/**,**/__pycache__/**,**/*.min.js,**/*.js,**/*.ts,**/*.tsx,tests/**,test-results/**,sonar/**,.scannerwork/**,aiforge_core/indexing/repomap/_vendor_*.py,aiforge_core/indexing/repomap/queries/**

# sonar.exclusions governs the MAIN set only. `sonar.tests=tests` indexes the
# test tree separately, so __pycache__/*.pyc under tests/ was still being read
# as source ("Invalid character encountered ... for encoding UTF-8"). Same
# class as the test-results/** scope bug: a build's own output is not source.
sonar.test.exclusions=**/__pycache__/**,**/*.pyc

sonar.python.version=3.11,3.12,3.13
sonar.sourceEncoding=UTF-8

# The build job emits both of these; without the paths Sonar reports 0%
# coverage and no test results even though the files are right there.
sonar.python.coverage.reportPaths=sonar/coverage.xml
sonar.python.xunit.reportPath=sonar/junit.xml
