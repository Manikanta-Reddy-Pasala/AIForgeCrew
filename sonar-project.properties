sonar.projectKey=aiforgecrew
sonar.projectName=AIForgeCrew
sonar.sources=aiforge_core,scripts
sonar.tests=tests

# The shared CI template runs the scanner from the project root and can set
# sonar.sources itself (`.`), which puts tests/ in the MAIN set while
# sonar.tests also claims it — that is the "File tests/__init__.py can't be
# indexed twice" failure. Excluding tests/** from the main set makes the two
# sets disjoint no matter what sources ends up being; sonar.tests above still
# indexes them as tests.
# aiforge_core/indexing/repomap/_vendor_*.py is VENDORED third-party source
# (aider-chat, Apache-2.0 — see NOTICE). It is kept byte-for-byte upstream so it
# can be re-synced, so its findings are not ours to fix and reformatting it
# would make every future diff unreadable. Excluded here for the same reason
# ruff's extend-exclude skips it. Our own wrapper, indexing/aider_map.py, IS
# analysed. The queries/*.scm tag files are data, not code.
# test-results/ and sonar/ hold the BUILD'S OWN OUTPUT — junit.xml, coverage.xml
# — which the scanner would otherwise index as XML source and raise findings on.
# They are still READ as reports: sonar.python.*.reportPath below resolves a
# report by path, independently of what is indexed as source.
sonar.exclusions=**/node_modules/**,**/.venv/**,**/.worktrees/**,**/web/dist/**,**/__pycache__/**,**/*.min.js,**/*.js,**/*.ts,**/*.tsx,tests/**,test-results/**,sonar/**,.scannerwork/**,aiforge_core/indexing/repomap/_vendor_*.py,aiforge_core/indexing/repomap/queries/**

sonar.python.version=3.11,3.12,3.13
sonar.sourceEncoding=UTF-8

# The build job emits both of these; without the paths Sonar reports 0%
# coverage and no test results even though the files are right there.
sonar.python.coverage.reportPaths=sonar/coverage.xml
sonar.python.xunit.reportPath=sonar/junit.xml
