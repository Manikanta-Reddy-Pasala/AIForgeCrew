name: AIForge eval suite (F1..F7)

# KISS gate: every PR + push to main runs scripts/evals/run_eval_suite.py
# against the fixtures dir. Exit-non-zero from the runner blocks merge.
# Heavy fixtures (live-mvn) are skipped here — only smoke-level
# F1/F3 included unless EVAL_FULL=1 is forced via workflow_dispatch.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: "Run full F1..F7 suite (slow)"
        required: false
        default: "false"

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AIFORGE_EVAL_SMOKE: "1"
      AIFORGE_MEMORY_BACKEND: "postgres"
      AIFORGE_EVAL_BACKEND: "ci"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install deps
        run: |
          uv sync --frozen
          uv pip list | head -30

      - name: Run eval suite (smoke)
        if: ${{ github.event.inputs.full != 'true' }}
        run: |
          mkdir -p evals/results
          uv run python scripts/evals/run_eval_suite.py \
            --fixtures evals/fixtures \
            --results  evals/results \
            --bail

      - name: Run eval suite (full)
        if: ${{ github.event.inputs.full == 'true' }}
        run: |
          mkdir -p evals/results
          uv run python scripts/evals/run_eval_suite.py \
            --fixtures evals/fixtures \
            --results  evals/results

      - name: Upload run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/
