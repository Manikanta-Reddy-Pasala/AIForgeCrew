name: bats
on:
  push:
    branches: [main]
  pull_request:

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bats + PyYAML
        run: |
          sudo apt-get update && sudo apt-get install -y bats
          python -m pip install PyYAML
      - name: Run bats
        run: bats tests/shell
