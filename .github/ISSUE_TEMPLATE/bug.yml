name: "Bug"
description: "Something broken. EM picks up."
title: "[BUG] "
labels: ["bug", "assignee/em"]
body:
  - type: textarea
    id: repro
    attributes:
      label: "Steps to reproduce"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected behavior"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "Actual behavior"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: "Environment"
      placeholder: "OS, commit SHA, model versions"
