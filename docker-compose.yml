# AIForge — DOCKER MODE (single-mode: embedded SQLite + scoped-OKR memory).
#
# One self-contained container: the app + ALL deps (aider, semantic/torch,
# sqlite-vec, structured/crawl/chunking, pre-built UI) baked into the image —
# nothing is fetched at run time. No Postgres/Neo4j/sidecars (that was the old
# "pro" stack; the project is single-mode now).
#
# FULL HOST FILESYSTEM is mounted at /host so the agent works on your real repos
# and files. AIFORGE_HOST_ROOT (default `/`) chooses what to expose; point it at
# a narrower dir (e.g. $HOME or ~/code) to limit the blast radius.
#
#   docker compose up -d --build        # or: ./run.sh --docker
#
# Persisted state (config, sqlite, memory, hf-cache) lives on the host under
# ${AIFORGE_DATA_DIR:-./data}/aiforge so it survives rebuilds.

services:
  aiforge:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
      args:
        # 0 → don't bake the embed model (smaller image; downloads on first use)
        PREFETCH_EMBED_MODEL: ${PREFETCH_EMBED_MODEL:-1}
    image: aiforge-app:latest
    container_name: aiforge
    restart: unless-stopped
    # Host networking so the app reaches a host-loopback LM endpoint (e.g. an
    # SSH tunnel / LM Studio on 127.0.0.1:1234) with no extra config.
    network_mode: host
    environment:
      # SECURITY: loopback bind by default — this API runs shell + edits files,
      # so it must not land on the LAN unauthenticated. To expose it, set BOTH
      # AIFORGE_BIND_HOST=0.0.0.0 and AIFORGE_API_TOKEN=<secret> (the app refuses
      # to boot on a non-loopback bind without a token).
      AIFORGE_BIND_HOST: ${AIFORGE_BIND_HOST:-127.0.0.1}
      AIFORGE_PORT: ${AIFORGE_PORT:-8799}
      AIFORGE_API_TOKEN: ${AIFORGE_API_TOKEN:-}
      AIFORGE_CONFIG_DIR: /data/aiforge
      # Real paraphrase recall — the image baked in sentence-transformers +
      # sqlite-vec and pre-downloaded the model.
      AIFORGE_EMBED_BACKEND: ${AIFORGE_EMBED_BACKEND:-semantic}
      # The agent's workspace = the mounted host filesystem, so edits/worktrees
      # land on the host and persist.
      AIFORGE_REPO_ROOT: ${AIFORGE_REPO_ROOT:-/host}
      # Point at your model endpoint (host loopback works via network_mode:host).
      AIFORGE_LM_BASE_URL: ${AIFORGE_LM_BASE_URL:-http://127.0.0.1:1234/v1}
      AIFORGE_LLM_SSL_VERIFY: ${AIFORGE_LLM_SSL_VERIFY:-true}
      # N>0 runs N ticket-runner loops in-container alongside the api; 0 = api only.
      AIFORGE_RUNNER_CONCURRENCY: ${AIFORGE_RUNNER_CONCURRENCY:-0}
      # Force a (re-)converge/migration on boot when set to 1.
      AIFORGE_MIGRATE: ${AIFORGE_MIGRATE:-}
    volumes:
      # Persisted app state (config, sqlite, memory briefs/captures, hf-cache).
      - ${AIFORGE_DATA_DIR:-./data}/aiforge:/data/aiforge
      # FULL host filesystem → /host (read-write). Narrow it with AIFORGE_HOST_ROOT.
      - ${AIFORGE_HOST_ROOT:-/}:/host
