# AIForge — DOCKER MODE, the default `./run.sh`. Start it through run.sh, which
# fills in your uid/home and the passthrough settings below.
#
# An Ubuntu 24.04 sandbox. Inside it the agent has full rights (your uid +
# passwordless sudo, no workspace jail) and open outbound network. It sees ONE
# host folder: ~/.aiforge, mounted at the same path — settings, credentials
# (security/), memory, tickets, and ~/.aiforge/workspace where projects live.
# Nothing else on the host is visible to it.
#
# The app copy and everything installed for it (.venv, node_modules, web/dist,
# codegraph) live in the `aiforge-state` volume, so restarts install nothing.
# `./run.sh --stop` stops it; removing that volume only forces a reinstall —
# your data is in ~/.aiforge, never in a volume.

services:
  aiforge:
    build:
      context: .
      network: host
      args:
        BASE_REGISTRY: ${AIFORGE_BASE_REGISTRY:-}
        APT_MIRROR: ${AIFORGE_APT_MIRROR:-}
        APP_UID: ${AIFORGE_UID:-1000}
        APP_GID: ${AIFORGE_GID:-1000}
        APP_USER: ${AIFORGE_USER:-aiforge}
        APP_HOME: ${AIFORGE_HOME:-/home/aiforge}
    image: aiforge-sandbox:local
    container_name: aiforge
    restart: unless-stopped
    # The host's network: the UI stays on the machine's loopback (no token
    # needed, same as native mode) and outbound connections just work.
    network_mode: host
    # Passed through from the environment ./run.sh runs in, only when set
    # there. Everything fixed comes from aiforge.env, which the inner run.sh
    # reads itself.
    environment:
      - AIFORGE_RUN_ARGS
      - AIFORGE_MOUNTS
      - AIFORGE_APT_MIRROR
      - AIFORGE_LM_BASE_URL
      - AIFORGE_API_TOKEN
      - AIFORGE_ROLE
      - AIFORGE_ADMIN_URL
      - AIFORGE_SYNC_GROUP
      - AIFORGE_EXTRAS
      - AIFORGE_EMBED_BACKEND
      - AIFORGE_RUNNER_POLL_SEC
      - AIFORGE_NPM_REGISTRY
      - UV_DEFAULT_INDEX
      - npm_config_registry
      - http_proxy
      - https_proxy
      - no_proxy
      - HTTP_PROXY
      - HTTPS_PROXY
      - NO_PROXY
    volumes:
      - ${AIFORGE_CONFIG_DIR:-~/.aiforge}:${AIFORGE_HOME:-/home/aiforge}/.aiforge
      - aiforge-state:/var/lib/aiforge

volumes:
  aiforge-state:
