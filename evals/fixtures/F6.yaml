id: F6
name: "New POST endpoint with DTO + service + validation"
project: PosClientBackend
assignee_role: developer
priority: medium
labels: [eval, context-strategy, memory-recall, new-api, multi-file]
max_turns: 40
title: "Implement POST /v1/api/paymentIn/quickEntry with QuickPaymentInService"
body: |
  ## Goal
  Add a new POST endpoint that creates a PaymentIn from a slim DTO, going through a new service layer with bean validation. Four-file change: two new files, two modified files.

  ## Acceptance criteria

  1. **New DTO file** `src/main/java/com/pos/backend/feature/paymentin/QuickPaymentInRequest.java`:
     - Package `com.pos.backend.feature.paymentin`
     - Annotated `@Data` (from `lombok`)
     - Fields:
       - `private String businessId;` annotated `@jakarta.validation.constraints.NotBlank`
       - `private String partyId;` annotated `@jakarta.validation.constraints.NotBlank`
       - `private Double amount;` annotated `@jakarta.validation.constraints.NotNull`
       - `private String paymentMode;` annotated `@jakarta.validation.constraints.NotBlank`

  2. **New service file** `src/main/java/com/pos/backend/feature/paymentin/QuickPaymentInService.java`:
     - Package `com.pos.backend.feature.paymentin`
     - Annotated `@org.springframework.stereotype.Service`, `@lombok.AllArgsConstructor`, `@lombok.extern.slf4j.Slf4j`
     - One private final field: `PaymentInRepository paymentInRepository;`
     - One public method:
       `public reactor.core.publisher.Mono<com.oneshell.commons.client.model.v1.PaymentIn> create(QuickPaymentInRequest request)`
       Body:
       - First line: `log.info("[QuickPaymentInService.create] called, businessId={}, partyId={}", request.getBusinessId(), request.getPartyId());`
       - Build a new `PaymentIn` instance using the no-arg constructor + setters (set businessId, partyId, amount, paymentMode from the request — use whatever setter names exist on the PaymentIn model; read the model to confirm if needed).
       - Return `paymentInRepository.save(<built PaymentIn>);`

  3. **Modify** `src/main/java/com/pos/backend/feature/paymentin/PaymentInController.java`:
     - Add a `private final QuickPaymentInService quickPaymentInService;` field declaration alongside the existing repository fields. Lombok's `@AllArgsConstructor` will pick it up — do NOT write a constructor.
     - Add a new endpoint method:
       ```
       @PostMapping("/quickEntry")
       public Mono<ResponseEntity<PaymentIn>> quickEntry(
               @org.springframework.validation.annotation.Validated
               @RequestBody QuickPaymentInRequest request) {
           log.info("[PaymentInController.quickEntry] called, businessId={}", request.getBusinessId());
           return quickPaymentInService.create(request)
                   .map(ResponseEntity::ok);
       }
       ```
     - Use existing imports where possible. Add the minimal new imports required (`Mono`, `ResponseEntity`, `PaymentIn`, `PostMapping`, `RequestBody` are likely already imported — verify by reading the file).

  4. **Do NOT modify** `PaymentInRepository.java`, any mapper, or any other file outside the four listed above.

  5. `mvn -DskipTests compile` must pass.

  ## Files
  - PosClientBackend/src/main/java/com/pos/backend/feature/paymentin/QuickPaymentInRequest.java (new)
  - PosClientBackend/src/main/java/com/pos/backend/feature/paymentin/QuickPaymentInService.java (new)
  - PosClientBackend/src/main/java/com/pos/backend/feature/paymentin/PaymentInController.java (modify)

  ## Hints
  - PaymentInController is `@RestController @RequestMapping("/v1/api/paymentIn") @AllArgsConstructor @Slf4j` — log + DI ready.
  - PaymentInRepository extends a ReactiveCrudRepository, so `.save(PaymentIn)` returns `Mono<PaymentIn>`.
  - `PaymentIn` model lives in `com.oneshell.commons.client.model.v1.PaymentIn` — has standard Lombok-generated setters/getters. Inspect the file via `code_run grep` if you need to confirm setter names.
