body: |
  ## Goal
  Create exactly ONE NEW FILE — a JUnit 5 unit test class. Do NOT modify any other file. The classes being tested already exist in the worktree and are READ-ONLY.

  ## What you must produce

  Exactly one new file at this path (use the absolute worktree path):
  `<worktree>/src/test/java/com/pos/backend/feature/paymentin/QuickPaymentInServiceImplTest.java`

  ## File body — fill the BODY markers, otherwise use this skeleton verbatim

  ```java
  package com.pos.backend.feature.paymentin;

  import com.oneshell.commons.client.model.v1.PaymentIn;
  import com.oneshell.commons.server.model.v1.PaymentInDao;
  import org.junit.jupiter.api.DisplayName;
  import org.junit.jupiter.api.Test;
  import org.springframework.stereotype.Service;
  import reactor.core.publisher.Mono;
  import reactor.core.publisher.Flux;

  import static org.assertj.core.api.Assertions.assertThat;

  class QuickPaymentInServiceImplTest {

      @Test
      @DisplayName("create() persists request via repository.save")
      void create_invokesRepositorySave() {
          // Capture vars
          final PaymentInDao[] captured = new PaymentInDao[1];

          // Anonymous PaymentInMapper that records toDao input + identity-passes through
          PaymentInMapper mapperStub = new PaymentInMapper() {
              @Override public PaymentInDao toDao(PaymentIn dto) {
                  PaymentInDao dao = new PaymentInDao();
                  dao.setBusinessId(dto.getBusinessId());
                  return dao;
              }
              @Override public PaymentIn toDto(PaymentInDao dao) {
                  PaymentIn dto = new PaymentIn();
                  dto.setBusinessId(dao.getBusinessId());
                  return dto;
              }
          };

          // Anonymous PaymentInRepository that records save input
          PaymentInRepository repoStub = new PaymentInRepository() {
              @Override public Mono<PaymentInDao> save(PaymentInDao dao) {
                  captured[0] = dao;
                  return Mono.just(dao);
              }
              // BODY: any other repository methods you must override to compile —
              // return Mono.empty() / Flux.empty() / null / false as minimal stubs.
              // If the model has trouble figuring out which methods to override, use:
              //   ReactiveMongoRepository<PaymentInDao, String> baseStub = ... (delegate)
              // but ONLY if anonymous-class compile fails. Try the inline stub first.
          };

          QuickPaymentInRequest req = new QuickPaymentInRequest();
          req.setBusinessId("biz-1");
          req.setPartyId("party-1");
          req.setAmount(100.0);
          req.setPaymentMode("CASH");

          QuickPaymentInServiceImpl service = new QuickPaymentInServiceImpl(repoStub, mapperStub);
          PaymentIn result = service.create(req).block();

          assertThat(captured[0]).isNotNull();
          assertThat(captured[0].getBusinessId()).isEqualTo("biz-1");
          assertThat(result.getBusinessId()).isEqualTo("biz-1");
      }

      @Test
      @DisplayName("@Service annotation present")
      void serviceImpl_isAnnotatedAsService() {
          assertThat(QuickPaymentInServiceImpl.class.isAnnotationPresent(Service.class))
                  .isTrue();
      }
  }
  ```

  ## Compile contract
  - The interface `PaymentInRepository` extends a reactive Mongo repository with many parent methods. The anonymous-class stub may need to override more than `save`. If the simple inline stub above does NOT compile, examine the compile error from `mvn -DskipTests test-compile`, add the minimal additional `@Override` methods (returning `Mono.empty()`/`Flux.empty()`/`null`/`false`) to satisfy the compiler, and try again. DO NOT modify the production interface.
  - If anonymous-class implementation gets too unwieldy, replace `repoStub` with a simple subclass declared as a private static nested class inside the test, overriding only `save`. Inheriting unimplemented abstract methods at compile time is fine for an interface only when the interface is `@FunctionalInterface` — `PaymentInRepository` is NOT functional, so you DO need to override every abstract method, or use a small wrapper.

  ## Hard constraints — read carefully
  1. **READ-ONLY production files.** You may `file_read` any of them but MUST NOT call `file_write`, `file_patch`, or `code_run` with anything that modifies these paths:
     - `src/main/java/com/pos/backend/feature/paymentin/QuickPaymentInServiceImpl.java`
     - `src/main/java/com/pos/backend/feature/paymentin/QuickPaymentInService.java`
     - `src/main/java/com/pos/backend/feature/paymentin/QuickPaymentInRequest.java`
     - `src/main/java/com/pos/backend/feature/paymentin/PaymentInController.java`
     - `src/main/java/com/pos/backend/feature/paymentin/PaymentInRepository.java`
     - `src/main/java/com/pos/backend/feature/paymentin/PaymentInMapper.java`
     - any other file under `src/main/`.
  2. ONE new file under `src/test/java/`. Nothing else.
  3. `mvn -DskipTests compile` must continue to pass (production unchanged).
  4. `mvn -DskipTests test-compile` must pass.

  ## Anti-patterns (each one = task failure)
  - Calling `ask_user`. Every fact you need is above or in the existing code; this fixture is fully self-contained.
  - Calling `start_long_term_update`.
  - Modifying QuickPaymentInServiceImpl, the repository, the mapper, or any production file. The whole point of a test is that production is unchanged.
  - Adding `@Mock` / `@InjectMocks` / `MockitoExtension` — Mockito is not part of this skeleton.
  - Calling `file_write` without an absolute path AND without a `<file_content>` block in the same assistant message.

  ## file_write protocol reminder (READ before calling)
  - `path` must be absolute: `<worktree>/src/test/java/com/pos/backend/feature/paymentin/QuickPaymentInServiceImplTest.java`.
  - The file body must be inside `<file_content>...</file_content>` tags (or a fenced code block) in the SAME assistant message that calls file_write.
  - Immediately after writing, run `code_run` with `ls -la <full path>` to confirm size > 0 BEFORE running mvn. If the file is missing, re-issue file_write with the body present.

