id: F8
name: "Full new API stack: controller + service iface + impl + repository"
project: PosClientBackend
assignee_role: developer
priority: medium
labels: [eval, new-api, multi-file, full-stack]
max_turns: 60
title: "Implement /v1/api/paymentIn/inactive endpoint with new InactivePaymentInService stack"
body: |
  ## Goal
  Add a new endpoint that lists "inactive" PaymentIns (deleted=true) for a
  business, with a full Spring layered stack: controller wiring, a service
  interface, a service implementation, and a custom repository method.

  ## Acceptance criteria

  1. **New service interface** at
     `src/main/java/com/pos/backend/feature/paymentin/InactivePaymentInService.java`
     - Package `com.pos.backend.feature.paymentin`
     - Single method:
       `reactor.core.publisher.Flux<com.oneshell.commons.client.model.v1.PaymentIn> listInactive(String businessId);`

  2. **New service impl** at
     `src/main/java/com/pos/backend/feature/paymentin/InactivePaymentInServiceImpl.java`
     - Package `com.pos.backend.feature.paymentin`
     - Annotated `@org.springframework.stereotype.Service`,
       `@lombok.AllArgsConstructor`, `@lombok.extern.slf4j.Slf4j`
     - `implements InactivePaymentInService`
     - Two private final fields, in this order:
       `PaymentInRepository paymentInRepository;`
       `PaymentInMapper paymentInMapper;`
     - `listInactive(String businessId)` body:
       - First line:
         `log.info("[InactivePaymentInServiceImpl.listInactive] called, businessId={}", businessId);`
       - Return:
         `paymentInRepository.findByBusinessIdAndDeletedTrue(businessId).map(paymentInMapper::toDto);`

  3. **Modify** `PaymentInRepository.java` (`src/main/java/com/pos/backend/feature/paymentin/PaymentInRepository.java`):
     - Add a derived-query method (no body, no `@Query`):
       `reactor.core.publisher.Flux<com.oneshell.commons.server.model.v1.PaymentInDao> findByBusinessIdAndDeletedTrue(String businessId);`
     - Spring Data Reactive Mongo will auto-implement this from the
       method name. Do NOT write a body.

  4. **Modify** `PaymentInController.java` (same package):
     - Add a `private final InactivePaymentInService inactivePaymentInService;`
       field next to the existing field declarations. Lombok
       `@AllArgsConstructor` picks it up — DO NOT write a constructor.
     - Add new endpoint method:
       ```java
       @GetMapping("/inactive/{businessId}")
       public Flux<PaymentIn> listInactive(@PathVariable String businessId) {
           log.info("[PaymentInController.listInactive] called, businessId={}", businessId);
           return inactivePaymentInService.listInactive(businessId);
       }
       ```

  5. **Do NOT modify** any other file. Specifically:
     - Do not touch `PaymentInMapper.java` (already provides `toDto` /
       `toDao`).
     - Do not touch `PaymentInWorkflow.java`.
     - Do not touch any saga / NATS / config file.

  6. `mvn -DskipTests compile` must pass.

  ## Files
  - PosClientBackend/src/main/java/com/pos/backend/feature/paymentin/InactivePaymentInService.java (new)
  - PosClientBackend/src/main/java/com/pos/backend/feature/paymentin/InactivePaymentInServiceImpl.java (new)
  - PosClientBackend/src/main/java/com/pos/backend/feature/paymentin/PaymentInRepository.java (modify)
  - PosClientBackend/src/main/java/com/pos/backend/feature/paymentin/PaymentInController.java (modify)

  ## Hints (read these before editing)
  - `PaymentInController` is `@RestController @RequestMapping("/v1/api/paymentIn") @AllArgsConstructor @Slf4j`.
  - `PaymentInRepository extends ReactiveMongoRepository<PaymentInDao, String>` and already has at least one derived method (`findByBusinessId`). Add the new method beside it.
  - `PaymentInMapper` is `@Mapper(componentModel="spring")` so Spring injects it. Methods you may use: `toDao(PaymentIn)` and `toDto(PaymentInDao)`.
  - `PaymentInDao` is the Mongo entity with a `deleted` field (boolean). `Spring Data` parses `findByBusinessIdAndDeletedTrue` as `WHERE businessId = ? AND deleted = true`.

  ## Anti-patterns
  - Do NOT call `ask_user`. All info needed is above.
  - Do NOT call `start_long_term_update`.
  - Do NOT modify any production file outside the four listed above.
  - Do NOT add unused imports. Use FQNs in declarations if a single
    import isn't already present.

expected:
  files_modified_min: 4
  files_modified_must_include:
    - "PosClientBackend/src/main/java/com/pos/backend/feature/paymentin/InactivePaymentInService.java"
    - "PosClientBackend/src/main/java/com/pos/backend/feature/paymentin/InactivePaymentInServiceImpl.java"
    - "PosClientBackend/src/main/java/com/pos/backend/feature/paymentin/PaymentInRepository.java"
    - "PosClientBackend/src/main/java/com/pos/backend/feature/paymentin/PaymentInController.java"
