id: F1
name: "Single-method log add"
project: PosClientBackend
assignee_role: developer
priority: medium
labels: [eval, context-strategy]
max_turns: 20
title: "Add entry log to SaleController.save()"
body: |
  ## Goal
  Add one log line at the start of the `save` method on `SaleController`.

  ## Acceptance criteria
  1. In `src/main/java/com/pos/backend/feature/sales/SaleController.java`, the `save` method body must start with `log.info("[SaleController.save] called");`. Use the existing `log` field — `@Slf4j` already adds it.

  ## Notes
  - Do not add new imports. Lombok's `@Slf4j` already supplies `log`.
  - Do not modify any other method or any other file.
  - `mvn -pl PosClientBackend -DskipTests compile` must pass.

  ## File to edit
  - PosClientBackend/src/main/java/com/pos/backend/feature/sales/SaleController.java
expected:
  files_modified_max: 1
  files_modified_must_include:
    - "PosClientBackend/src/main/java/com/pos/backend/feature/sales/SaleController.java"
