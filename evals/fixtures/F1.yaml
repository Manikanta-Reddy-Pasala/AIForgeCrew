id: F1
name: "Single-file logger add"
project: PosClientBackend
assignee_role: developer
priority: medium
labels: [eval, context-strategy]
max_turns: 25
title: "Add entry log to every public handler in SaleController"
body: |
  ## Goal
  Every public handler method on `SaleController` must log a single line at entry naming the method.

  ## Acceptance criteria
  1. For every `public` method that returns `Mono<…>` or `Flux<…>` in `src/main/java/com/pos/backend/feature/sales/SaleController.java`, add a `log.info("[SaleController.<methodName>] called")` as the first statement of the method body.
  2. Use the existing `log` field — the class already has `@Slf4j` from Lombok, so `log` is in scope. Do NOT add a new logger.
  3. Do not change any method signature, return type, parameter, or other behaviour.
  4. Do not modify any other file.
  5. `mvn -pl PosClientBackend -DskipTests compile` must pass after the change.

  ## File to edit
  - PosClientBackend/src/main/java/com/pos/backend/feature/sales/SaleController.java
expected:
  files_modified_max: 1
  files_modified_must_include:
    - "PosClientBackend/src/main/java/com/pos/backend/feature/sales/SaleController.java"
