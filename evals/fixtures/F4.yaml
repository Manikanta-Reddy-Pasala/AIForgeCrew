title: "Add entry log to PaymentInController.save()"
body: |
  ## Goal
  Add one log line at the start of the `save` method on `PaymentInController`.

  ## Acceptance criteria
  1. In `src/main/java/com/pos/backend/feature/paymentin/PaymentInController.java`, the `save` method body must start with `log.info("[PaymentInController.save] called");`. Use the existing `log` field — `@Slf4j` already adds it.

  ## Notes
  - Do not add new imports. Lombok's `@Slf4j` already supplies `log`.
  - Do not modify any other method or any other file.
  - `mvn -DskipTests compile` must pass.

  ## File to edit
  - PosClientBackend/src/main/java/com/pos/backend/feature/paymentin/PaymentInController.java
expected:
  files_modified_max: 1
  files_modified_must_include:
    - "PosClientBackend/src/main/java/com/pos/backend/feature/paymentin/PaymentInController.java"
