title: "Add payment-mode breakdown endpoint to PaymentIn feature"
body: |
  ## Goal

  Expose a new GET endpoint under the existing PaymentIn feature that
  returns a per-payment-mode breakdown for a given business: how many
  payments and the total amount, grouped by `paymentMode`.

  ## Behavior

  - Path: `/v1/api/paymentIn/breakdown/{businessId}`.
  - Returns a reactive list (`Flux`) of objects each carrying
    `paymentMode`, `count`, and `totalAmount`.
  - Only counts payments that are NOT soft-deleted (`deleted` field
    must be false or absent).
  - Empty list when the business has no payments.
  - Order doesn't matter, but be deterministic if it's free.

  ## Constraints

  - Use the existing PaymentIn feature module — don't introduce a new
    package.
  - Reuse whatever DAO/repository pattern the rest of the feature uses.
  - The endpoint method must log its entry with `log.info(...)` carrying
    the businessId, matching the style other endpoints in this
    controller use.
  - Mongo-side aggregation is preferred over reading every row into
    memory, but if the existing repository only supports method-name
    derivation, falling back to in-memory reduce is acceptable.
  - Don't break any existing endpoint or test.

  ## Acceptance criteria

  1. New endpoint reachable at `/v1/api/paymentIn/breakdown/{businessId}`.
  2. Response shape matches the description above (paymentMode + count +
     totalAmount per group).
  3. Soft-deleted payments excluded from the aggregate.
  4. `log.info` line on entry, businessId interpolated.
  5. `mvn -DskipTests compile` passes.
  6. No changes outside the PaymentIn feature module.

  ## Anti-patterns

  - Don't introduce a new top-level package, controller class, or
    Spring config bean unless strictly needed.
  - Don't call `ask_user` — discover the codebase yourself.
  - Don't write memory (`start_long_term_update` is forbidden).

