id: F7a
name: "F7 split — DTO + service interface (2 files)"
project: PosClientBackend
assignee_role: developer
priority: medium
labels: [eval, split, F7]
max_turns: 20
title: "Add QuickPaymentInRequest DTO + QuickPaymentInService interface"
body: |
  ## Goal
  Create exactly two new files. No other files may change.

  ## Acceptance criteria

  1. **New DTO** `src/main/java/com/pos/backend/feature/paymentin/QuickPaymentInRequest.java`
     - Package `com.pos.backend.feature.paymentin`
     - Annotated `@lombok.Data`
     - Fields:
       - `private String businessId;` annotated `@jakarta.validation.constraints.NotBlank`
       - `private String partyId;` annotated `@jakarta.validation.constraints.NotBlank`
       - `private Double amount;` annotated `@jakarta.validation.constraints.NotNull`
       - `private String paymentMode;` annotated `@jakarta.validation.constraints.NotBlank`

  2. **New service interface** `src/main/java/com/pos/backend/feature/paymentin/QuickPaymentInService.java`
     - Package `com.pos.backend.feature.paymentin`
     - One method signature: `reactor.core.publisher.Mono<com.oneshell.commons.client.model.v1.PaymentIn> create(QuickPaymentInRequest request);`

  3. **Do not modify any existing file.** Do not create the impl class — that comes in a follow-up task.
  4. `mvn -DskipTests compile` must pass.

  ## Anti-patterns
  - Do NOT call `ask_user`. All info needed is in this spec or the codebase.
  - Do NOT call `start_long_term_update`.
  - File names must include the `Quick` prefix exactly.
expected:
  files_modified_min: 2
  files_modified_must_include:
    - "PosClientBackend/src/main/java/com/pos/backend/feature/paymentin/QuickPaymentInRequest.java"
    - "PosClientBackend/src/main/java/com/pos/backend/feature/paymentin/QuickPaymentInService.java"
