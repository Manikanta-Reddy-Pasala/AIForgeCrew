title: "Add QuickPaymentInServiceImpl + wire endpoint into PaymentInController"
body: |
  ## Goal
  This task assumes `QuickPaymentInRequest.java` and `QuickPaymentInService.java` already exist in the worktree (they were created by a prior task). Build the implementation class and wire the new endpoint into `PaymentInController`.

  ## Acceptance criteria

  1. **New service impl** `src/main/java/com/pos/backend/feature/paymentin/QuickPaymentInServiceImpl.java`
     - Package `com.pos.backend.feature.paymentin`
     - Annotated `@org.springframework.stereotype.Service`, `@lombok.AllArgsConstructor`, `@lombok.extern.slf4j.Slf4j`
     - `implements QuickPaymentInService` (reuse the existing interface — DO NOT redeclare it)
     - Two private final fields, in this order: `PaymentInRepository paymentInRepository;` then `PaymentInMapper paymentInMapper;`
     - `create(QuickPaymentInRequest request)` body:
       - First line: `log.info("[QuickPaymentInServiceImpl.create] called, businessId={}", request.getBusinessId());`
       - Build a `com.oneshell.commons.client.model.v1.PaymentIn` via no-arg constructor + setters (set businessId, partyId, amount, paymentMode — confirm setter names by grepping the existing codebase; PaymentInMapper.java + PaymentInController.java reference them).
       - `return paymentInMapper`-then-`.toDao(payment)` (or chain: `Mono.just(paymentInMapper.toDao(payment)).flatMap(paymentInRepository::save).map(paymentInMapper::toDto)`).
       - The method must return `Mono<PaymentIn>` matching the interface.

  2. **Modify** `src/main/java/com/pos/backend/feature/paymentin/PaymentInController.java`
     - Add `private final QuickPaymentInService quickPaymentInService;` field declaration alongside existing fields. Lombok `@AllArgsConstructor` will pick it up — DO NOT write a constructor.
     - Add new endpoint method:
       ```
       @PostMapping("/quickEntry")
       public Mono<ResponseEntity<PaymentIn>> quickEntry(
               @org.springframework.validation.annotation.Validated
               @RequestBody QuickPaymentInRequest request) {
           log.info("[PaymentInController.quickEntry] called, businessId={}", request.getBusinessId());
           return quickPaymentInService.create(request).map(ResponseEntity::ok);
       }
       ```

  3. **Do NOT modify** `PaymentInRepository.java`, `PaymentInMapper.java`, `PaymentInWorkflow.java`, `PaymentInService.java` (the interface — already correct), `QuickPaymentInRequest.java`, or any other file outside the two listed.

  4. `mvn -DskipTests compile` must pass.

  ## Anti-patterns
  - Do NOT call `ask_user`. Existing `PaymentInController.save` + `PaymentInMapper` show the DAO/DTO pattern.
  - Do NOT redeclare or modify `QuickPaymentInService` — it already exists with the correct signature.
  - Do NOT call `start_long_term_update`.
expected:
  files_modified_min: 2
  files_modified_must_include:
    - "PosClientBackend/src/main/java/com/pos/backend/feature/paymentin/QuickPaymentInServiceImpl.java"
    - "PosClientBackend/src/main/java/com/pos/backend/feature/paymentin/PaymentInController.java"
