[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiforge-memory"
version = "0.1.2"
description = "AiForgeMemory — unified code memory: Repo / Service / File / Symbol + chunk vectors. Repomix + tree-sitter + LLM."
requires-python = ">=3.11"
authors = [{name = "Manikanta Reddy Pasala"}]
license = {text = "MIT"}
readme = "README.md"
dependencies = [
  "openai>=1.50",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "tree-sitter>=0.23,<0.26",
  # 1.6.x wheel is broken (dist-info only, no module); pin <1.0
  "tree-sitter-language-pack>=0.13,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]
ui = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
]
# AST-aware code chunking (features/chunk/chonkie_adapter.py) — optional;
# ingestion falls back to line windows when absent. NOTE: needs a newer
# tree-sitter-language-pack than the monorepo root env (the vendored RepoMap's
# old one) — install this extra in the memory service's own env.
# BASE chonkie: DOC chunking (RecursiveChunker, no tree-sitter). CODE
# chunking needs NO extra at all — own AST packer over the core
# tree-sitter-language-pack dep (chonkie's CodeChunker was removed: it needs
# tslp>=1.x, unresolvable next to the RepoMap's 0.13 tag queries).
chunking = ["chonkie>=1.0"]

[tool.setuptools.packages.find]
include = ["aiforge_memory*"]

[tool.setuptools.package-data]
"aiforge_memory.features.repo" = ["prompts/*.txt"]
"aiforge_memory.features.file" = ["prompts/*.txt"]
"aiforge_memory.features.service" = ["prompts/*.txt"]
"aiforge_memory.features.symbol" = ["prompts/*.txt", "queries/*.scm"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "aiforge_memory/features/**/tests/fixtures/**",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["aiforge_memory"]
addopts = "-ra"
markers = [
    "live_llm: requires planner LLM at AIFORGE_INTENT_LM_URL",
    "live_repomix: requires `repomix` binary on PATH",
]
